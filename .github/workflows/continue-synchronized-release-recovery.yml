name: Continue Synchronized Release Recovery
run-name: "Continue synchronized v0.6.2 / ${{ github.sha }} / ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH UPDATED V0.6.2 READINESS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buh-published-platform-v0.6.2-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: Qualify the reviewed synchronization update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      release_commit: ${{ steps.contract.outputs.release_commit }}
      source_commit: ${{ steps.contract.outputs.source_commit }}
      sync_head_commit: ${{ steps.contract.outputs.sync_head_commit }}
      check_association_repair_commit: ${{ steps.contract.outputs.check_association_repair_commit }}
      check_association_repair_feature_head: ${{ steps.contract.outputs.check_association_repair_feature_head }}
      sync_repair_commit: ${{ steps.contract.outputs.sync_repair_commit }}
      sync_repair_feature_head: ${{ steps.contract.outputs.sync_repair_feature_head }}
    steps:
      - name: Check out the exact reviewed repair merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the immutable release and exact synchronization update
        id: contract
        env:
          ACTOR: ${{ github.actor }}
          API_URL: ${{ github.api_url }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          [[ "${CONFIRMATION}" == "PUBLISH UPDATED V0.6.2 READINESS" ]]
          [[ "${RUN_ATTEMPT}" == "1" ]]
          [[ "${SELECTED_REF}" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "${SELECTED_SHA}" ]]
          [[ "${ACTOR}" == "${TRIGGERING_ACTOR}" ]]
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          fi
          [[ "${ACTOR}" == "${{ github.repository_owner }}" || \
             (-n "${WORK_ACTOR}" && "${ACTOR}" == "${WORK_ACTOR}") ]]
          mkdir -p build
          python3 ops/release/validation_recovery.py \
            --contract ops/release/published-release-recovery-v0.6.2.json \
            check-association-repair \
            --root . \
            --source-commit "${SELECTED_SHA}" \
            --event-name workflow_dispatch \
            --output build/check-association-repair.json >/dev/null

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/git/ref/heads/release/platform-v0.6.2" \
            >build/release-ref.json
          [[ "$(jq -er '.object.type' build/release-ref.json)" == "commit" ]]
          release_commit="$(jq -er '.object.sha' build/release-ref.json)"
          [[ "${release_commit}" == "6074b965cbd2e6ab2630cd539ee455b8d419aef6" ]]

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/git/ref/heads/sync/platform-v0.6.2" \
            >build/sync-ref.json
          [[ "$(jq -er '.object.type' build/sync-ref.json)" == "commit" ]]
          sync_head="$(jq -er '.object.sha' build/sync-ref.json)"
          [[ "${sync_head}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${sync_head}" != "${release_commit}" ]]
          git fetch --no-tags origin "${sync_head}"
          [[ "$(git rev-parse FETCH_HEAD)" == "${sync_head}" ]]
          python3 ops/release/validation_recovery.py \
            --contract ops/release/published-release-recovery-v0.6.2.json \
            sync-update \
            --root . \
            --source-commit "${sync_head}" \
            --repair-commit "${SELECTED_SHA}" \
            --output build/sync-update.json >/dev/null

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/pulls/52" >build/sync-pr.json
          jq -e \
            --arg base "${SELECTED_SHA}" \
            --arg head "${sync_head}" \
            --arg repository "${REPOSITORY}" '
              .number == 52 and
              .state == "open" and
              .draft == false and
              .title == "Sync platform release v0.6.2" and
              .head.ref == "sync/platform-v0.6.2" and
              .head.sha == $head and
              .head.repo.full_name == $repository and
              .base.ref == "main" and
              .base.sha == $base and
              .base.repo.full_name == $repository and
              .mergeable == true and
              .mergeable_state == "clean"
            ' build/sync-pr.json >/dev/null
          printf 'sync_head_commit=%s\n' "${sync_head}" >>"${GITHUB_OUTPUT}"

  ready:
    name: Publish fresh readiness for the updated synchronization head
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the exact reviewed repair merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.qualify.outputs.check_association_repair_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify the native head and supersede only historical readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SYNC_HEAD: ${{ needs.qualify.outputs.sync_head_commit }}
          CHECK_ASSOCIATION_REPAIR_COMMIT: ${{ needs.qualify.outputs.check_association_repair_commit }}
          CHECK_ASSOCIATION_REPAIR_FEATURE_HEAD: ${{ needs.qualify.outputs.check_association_repair_feature_head }}
          SYNC_REPAIR_COMMIT: ${{ needs.qualify.outputs.sync_repair_commit }}
          SYNC_REPAIR_FEATURE_HEAD: ${{ needs.qualify.outputs.sync_repair_feature_head }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          mkdir -p build
          git fetch --no-tags origin "${SYNC_HEAD}"
          [[ "$(git rev-parse FETCH_HEAD)" == "${SYNC_HEAD}" ]]
          python3 ops/release/validation_recovery.py \
            --contract ops/release/published-release-recovery-v0.6.2.json \
            sync-update \
            --root . \
            --source-commit "${SYNC_HEAD}" \
            --repair-commit "${CHECK_ASSOCIATION_REPAIR_COMMIT}" \
            --output build/sync-update.json >/dev/null
          allowed_mergers=(--allowed-merger "${REPOSITORY_OWNER}")
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
            allowed_mergers+=(--allowed-merger "${WORK_ACTOR}")
          fi
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 57 \
            --feature-head "${SYNC_REPAIR_FEATURE_HEAD}" \
            --merge-source-commit "${SYNC_REPAIR_COMMIT}" \
            "${allowed_mergers[@]}" \
            --output build/sync-repair-readiness.json >/dev/null
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 59 \
            --feature-head "${CHECK_ASSOCIATION_REPAIR_FEATURE_HEAD}" \
            --merge-source-commit "${CHECK_ASSOCIATION_REPAIR_COMMIT}" \
            "${allowed_mergers[@]}" \
            --output build/check-association-repair-readiness.json >/dev/null
          python3 ops/release/platform_approval.py recover-ready-update \
            --owner "${REPOSITORY_OWNER}" \
            --repository "${REPOSITORY}" \
            --recovery-contract ops/release/published-release-recovery-v0.6.2.json \
            --sync-update build/sync-update.json \
            --sync-repair-readiness build/sync-repair-readiness.json \
            --check-association-repair-readiness build/check-association-repair-readiness.json \
            --work-actor "${WORK_ACTOR}" \
            --api-url "${{ github.api_url }}" \
            --server-url "${{ github.server_url }}" \
            --output build/platform-approval-recovery.json >/dev/null
