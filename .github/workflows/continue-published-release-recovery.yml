name: Continue Published Release Recovery
run-name: "Continue published v0.6.2 / ${{ github.sha }} / ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONTINUE PUBLISHED V0.6.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buh-published-platform-v0.6.2-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: Qualify the reviewed publication continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      publication_repair_commit: ${{ steps.contract.outputs.publication_repair_commit }}
      publication_repair_feature_head: ${{ steps.contract.outputs.publication_repair_feature_head }}
      release_commit: ${{ steps.contract.outputs.release_commit }}
      repair_commit: ${{ steps.contract.outputs.repair_commit }}
      source_commit: ${{ steps.contract.outputs.source_commit }}
    steps:
      - name: Check out the exact publication-repair merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate actor, publication repair, immutable refs, and synchronization PR
        id: contract
        env:
          ACTOR: ${{ github.actor }}
          API_URL: ${{ github.api_url }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          [[ "${CONFIRMATION}" == "CONTINUE PUBLISHED V0.6.2" ]]
          [[ "${RUN_ATTEMPT}" == "1" ]]
          [[ "${SELECTED_REF}" == "refs/heads/main" ]]
          [[ "${SELECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SELECTED_SHA}" ]]
          [[ "${ACTOR}" == "${TRIGGERING_ACTOR}" ]]
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          fi
          [[ "${ACTOR}" == "${{ github.repository_owner }}" || \
             (-n "${WORK_ACTOR}" && "${ACTOR}" == "${WORK_ACTOR}") ]]
          mkdir -p build
          python3 ops/release/validation_recovery.py \
            --contract ops/release/published-release-recovery-v0.6.2.json \
            publication-repair \
            --root . \
            --source-commit "${SELECTED_SHA}" \
            --event-name workflow_dispatch \
            --output build/recovery-publication-repair.json >/dev/null

          for branch in release/platform-v0.6.2 sync/platform-v0.6.2; do
            encoded="${branch//\//%2F}"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/git/ref/heads/${encoded}" \
              >"build/${branch%%/*}-ref.json"
            [[ "$(jq -er '.object.type' "build/${branch%%/*}-ref.json")" == \
               "commit" ]]
            [[ "$(jq -er '.object.sha' "build/${branch%%/*}-ref.json")" == \
               "6074b965cbd2e6ab2630cd539ee455b8d419aef6" ]]
          done
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/pulls/52" >build/sync-pr.json
          jq -e \
            --arg repository "${REPOSITORY}" '
              .number == 52 and
              .state == "open" and
              .draft == false and
              .title == "Sync platform release v0.6.2" and
              .head.ref == "sync/platform-v0.6.2" and
              .head.sha == "6074b965cbd2e6ab2630cd539ee455b8d419aef6" and
              .head.repo.full_name == $repository and
              .base.ref == "main" and
              .base.repo.full_name == $repository
            ' build/sync-pr.json >/dev/null

  ready:
    name: Publish the retained recovery readiness
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the exact publication-repair merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.qualify.outputs.publication_repair_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the retained exact recovery attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: 10279641606
          path: build/recovery-validation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34638993007
          merge-multiple: true

      - name: Reverify retained evidence and publish only the missing readiness marker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_COMMIT: ${{ needs.qualify.outputs.publication_repair_commit }}
          PUBLICATION_FEATURE_HEAD: ${{ needs.qualify.outputs.publication_repair_feature_head }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          [[ "$(sha256sum build/recovery-validation/platform-validation-recovery.json | cut -d' ' -f1)" == \
             "109f96e5d81de4a2f97de239ba71170dde6a0eb65c1240eb48047550825d594d" ]]
          python3 ops/release/validation_recovery.py \
            --contract ops/release/published-release-recovery-v0.6.2.json \
            verify-attestation \
            --attestation build/recovery-validation/platform-validation-recovery.json \
            --run-id 34638993007 \
            --run-attempt 1 \
            --repair-commit f064694cca7e9d1147a87b880636a94f5c5cbe94 >/dev/null
          python3 ops/release/validation_recovery.py \
            --contract ops/release/published-release-recovery-v0.6.2.json \
            publication-repair \
            --root . \
            --source-commit "${PUBLICATION_COMMIT}" \
            --event-name workflow_dispatch \
            --output build/recovery-publication-repair.json >/dev/null
          allowed_mergers=(--allowed-merger "${REPOSITORY_OWNER}")
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
            allowed_mergers+=(--allowed-merger "${WORK_ACTOR}")
          fi
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 53 \
            --feature-head a8aaf10e03c35a5510f0a7e03a92d4f19e8be0e8 \
            --merge-source-commit e0bd37fafcedee3135aa4c4d6bdfc7778d032d48 \
            "${allowed_mergers[@]}" \
            --output build/activation-feature-readiness.json >/dev/null
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 54 \
            --feature-head a743e222546371f386a629459ab8e7b209684905 \
            --merge-source-commit 57e0e29042bab3a989c80e5473ad552ec5b4505b \
            "${allowed_mergers[@]}" \
            --output build/continuation-feature-readiness.json >/dev/null
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 55 \
            --feature-head e4ec240abce3736907d4708fe7fa984413d838b7 \
            --merge-source-commit f064694cca7e9d1147a87b880636a94f5c5cbe94 \
            "${allowed_mergers[@]}" \
            --output build/repair-feature-readiness.json >/dev/null
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 56 \
            --feature-head "${PUBLICATION_FEATURE_HEAD}" \
            --merge-source-commit "${PUBLICATION_COMMIT}" \
            "${allowed_mergers[@]}" \
            --output build/publication-feature-readiness.json >/dev/null
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request 51 \
            --feature-head 7e945de03a75e8d7ec75930f7e60fe402abfcf48 \
            --merge-source-commit 4f98e7cb559ee1a9b269ea1f94938678d2dac4df \
            "${allowed_mergers[@]}" \
            --output build/original-feature-readiness.json >/dev/null
          python3 ops/release/platform_approval.py recover-ready \
            --owner "${REPOSITORY_OWNER}" \
            --repository "${REPOSITORY}" \
            --recovery-contract ops/release/published-release-recovery-v0.6.2.json \
            --feature-readiness build/original-feature-readiness.json \
            --activation-readiness build/activation-feature-readiness.json \
            --continuation-readiness build/continuation-feature-readiness.json \
            --repair-readiness build/repair-feature-readiness.json \
            --publication-repair build/recovery-publication-repair.json \
            --publication-readiness build/publication-feature-readiness.json \
            --validation-attestation build/recovery-validation/platform-validation-recovery.json \
            --validation-artifact-id 10279641606 \
            --validation-artifact-name platform-validation-recovery-v0.6.2-6074b965cbd2-34638993007-1 \
            --validation-artifact-digest sha256:2890ce18bd66892972c732a92fbdd82aec22c899a752353375f5e91a8335c37b \
            --work-actor "${WORK_ACTOR}" \
            --api-url "${{ github.api_url }}" \
            --server-url "${{ github.server_url }}" \
            --output build/platform-approval-recovery.json >/dev/null
