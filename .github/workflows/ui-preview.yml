name: Preview UI
run-name: "Preview UI / PR #${{ github.event.pull_request.number || inputs.pull_request }} / ${{ github.event.pull_request.head.sha || 'manual' }} / ${{ github.event.action || 'workflow_dispatch' }} / ${{ github.event.label.name || 'none' }}"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to preview (manual evidence is diagnostic only)
        required: true
        type: string
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A skipped bookkeeping-label run must not cancel the actual preview.
  group: ui-preview-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ui-preview' && format('ignored-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview UI
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ui-preview' }}
    uses: ./.github/workflows/reusable-ui-preview.yml
    with:
      pull_request: ${{ inputs.pull_request || '' }}
    permissions:
      contents: read
      pull-requests: read
