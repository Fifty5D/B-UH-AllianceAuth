name: Preview UI
run-name: "Preview UI / PR #${{ github.event.pull_request.number || inputs.pull_request }} / ${{ github.event.pull_request.head.sha || 'manual' }} / ${{ github.event.action || 'workflow_dispatch' }} / ${{ github.event.label.name || 'none' }}"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to preview (manual evidence is diagnostic only)
        required: true
        type: string
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preview:
    name: Fake-data desktop and mobile preview
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ui-preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BUILDX_BAKE_FILE_RELATIVE_PATHS: "1"
      BUH_COMPOSE_PROJECT: buh-${{ github.run_id }}-${{ github.run_attempt }}-preview
      BUH_TEST_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}-preview
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve the exact open pull-request head
        id: target
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pull_request }}
        run: |
          set -Eeuo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr="${EVENT_PR}"
          else
            pr="${INPUT_PR}"
          fi
          [[ "${pr}" =~ ^[1-9][0-9]*$ ]]
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          [[ "$(jq -r '.state' <<<"${pull}")" == "open" ]]
          head="$(jq -r '.head.sha' <<<"${pull}")"
          head_repository="$(jq -r '.head.repo.full_name' <<<"${pull}")"
          changed_files="$(jq -r '.changed_files' <<<"${pull}")"
          [[ "${head}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${head_repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${changed_files}" =~ ^[0-9]+$ ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${head}" == "${EVENT_HEAD}" ]]
          fi
          printf 'pr=%s\nhead_sha=%s\nhead_repository=%s\nchanged_files=%s\n' \
            "${pr}" "${head}" "${head_repository}" "${changed_files}" \
            >>"${GITHUB_OUTPUT}"

      - name: Check out the selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          persist-credentials: false

      - name: Verify the exact checked-out head
        env:
          PREVIEW_REF: ${{ steps.target.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${PREVIEW_REF}" ]]

      - name: Detect preview-relevant changes
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          MANUAL_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'ui-preview') }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CHANGED_FILES: ${{ steps.target.outputs.changed_files }}
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_CHANGED_FILES}" =~ ^[0-9]+$ ]]
          if (( EXPECTED_CHANGED_FILES >= 3000 )); then
            echo "Changed-file evidence reaches GitHub's 3,000-file enumeration limit." >&2
            exit 1
          fi
          files="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          jq -e '
            type == "array" and
            all(.[]; type == "array") and
            all(.[][]; type == "object" and (.filename | type == "string"))
          ' <<<"${files}" >/dev/null
          actual_changed_files="$(jq '[.[][]] | length' <<<"${files}")"
          [[ "${actual_changed_files}" == "${EXPECTED_CHANGED_FILES}" ]]
          relevant=false
          if [[ "${EVENT_NAME}" == workflow_dispatch || "${MANUAL_OVERRIDE}" == true ]]; then
            relevant=true
          elif jq -e '
            any(.[][];
              .filename | test(
                "(^|/)(templates?|static|themes?|browser)(/|$)|^\\.github/workflows/(ui-preview|invalidate-readiness)\\.ya?ml$|^ops/readiness\\.py$|^platform/test(auth|env)/|^tests/platform/test_(readiness|configuration)\\.py$|\\.(css|scss|sass|less|js|jsx|mjs|cjs|ts|tsx|html)$";
                "i"
              )
            )
          ' <<<"${files}" >/dev/null; then
            relevant=true
          fi
          printf 'relevant=%s\n' "${relevant}" >>"${GITHUB_OUTPUT}"

      - name: Read the reviewed test-image contract
        if: steps.relevance.outputs.relevant == 'true'
        env:
          PREVIEW_CACHE_SCOPE: ui-preview-${{ steps.target.outputs.pr }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          import os

          values = {}
          for raw_line in Path("platform/testenv/env.example").read_text(
              encoding="utf-8"
          ).splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              key, separator, value = line.partition("=")
              if not separator or not key or not value:
                  raise SystemExit(f"Malformed test environment entry: {raw_line!r}")
              values[key] = value

          required = {
              "BUH_PYTHON_IMAGE",
              "BUH_MARIADB_IMAGE",
              "BUH_REDIS_IMAGE",
              "BUH_FAKE_ESI_IMAGE",
              "BUH_PLAYWRIGHT_IMAGE",
          }
          if not required.issubset(values):
              missing = ", ".join(sorted(required - values.keys()))
              raise SystemExit(f"Missing test image settings: {missing}")

          safe_image = re.compile(r"[A-Za-z0-9][A-Za-z0-9./:_@+-]{1,255}")
          cache_scope = os.environ["PREVIEW_CACHE_SCOPE"]
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", cache_scope):
              raise SystemExit("Unsafe preview cache scope")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              for key in sorted(required):
                  value = values[key]
                  if not safe_image.fullmatch(value):
                      raise SystemExit(f"Unsafe image value for {key}")
                  print(f"{key}={value}", file=output)
              print(f"BUH_CACHE_SCOPE={cache_scope}", file=output)
              print("BUH_CACHE_LANE=preview", file=output)
          PY

      - name: Prepare the synthetic artifact directory
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/ui-preview/screenshots artifacts/ui-preview/playwright-report
          : >artifacts/ui-preview/run.log

      - name: Set up Docker Buildx
        if: steps.relevance.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build cached Auth and browser images
        if: steps.relevance.outputs.relevant == 'true'
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: platform/testenv/docker-bake.hcl
          targets: |
            testauth
            browser
          set: |
            testauth.args.PYTHON_IMAGE=${{ env.BUH_PYTHON_IMAGE }}
            browser.args.PLAYWRIGHT_IMAGE=${{ env.BUH_PLAYWRIGHT_IMAGE }}

      - name: Capture fake-data previews on an isolated network
        if: steps.relevance.outputs.relevant == 'true'
        env:
          PREVIEW_CONTAINER: buh-ui-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          COMPOSE=(
            docker compose
            --project-name "${BUH_COMPOSE_PROJECT}"
            -f platform/testenv/compose.yml
          )
          REPORT_DIR="artifacts/ui-preview"

          collect_and_teardown() {
            result=$?
            trap - EXIT
            "${COMPOSE[@]}" ps -a >"${REPORT_DIR}/compose-ps.txt" 2>&1 || true
            "${COMPOSE[@]}" logs --no-color \
              db redis fake-esi web >"${REPORT_DIR}/service-logs.txt" 2>&1 || true
            if docker container inspect "${PREVIEW_CONTAINER}" >/dev/null 2>&1; then
              docker cp \
                "${PREVIEW_CONTAINER}:/browser/preview-output/." \
                "${REPORT_DIR}/screenshots/" 2>>"${REPORT_DIR}/run.log"
              docker cp \
                "${PREVIEW_CONTAINER}:/browser/playwright-report/." \
                "${REPORT_DIR}/playwright-report/" 2>>"${REPORT_DIR}/run.log"
              docker rm --force "${PREVIEW_CONTAINER}" \
                >>"${REPORT_DIR}/run.log" 2>&1 || true
            fi
            "${COMPOSE[@]}" down --volumes --remove-orphans \
              >"${REPORT_DIR}/teardown.log" 2>&1 || true
            exit "${result}"
          }
          trap collect_and_teardown EXIT

          run_logged() {
            "$@" 2>&1 | tee -a "${REPORT_DIR}/run.log"
          }

          run_logged "${COMPOSE[@]}" up -d --wait db redis fake-esi
          run_logged "${COMPOSE[@]}" run --rm \
            -e BUH_TEST_SETTINGS=testauth.settings.browser test \
            python manage.py migrate --noinput --no-color
          run_logged "${COMPOSE[@]}" run --rm \
            -e BUH_TEST_SETTINGS=testauth.settings.browser test \
            python manage.py buh_seed_test_platform --reset --no-color
          run_logged "${COMPOSE[@]}" up -d --wait web
          run_logged "${COMPOSE[@]}" run --name "${PREVIEW_CONTAINER}" \
            -e BUH_PREVIEW_OUTPUT_DIR=/browser/preview-output \
            -e PLAYWRIGHT_HTML_OUTPUT_DIR=/browser/playwright-report \
            browser npx --no-install playwright test \
              preview.spec.ts console-preview.spec.ts \
              moon-tax.spec.ts console-theme.spec.ts

      - name: Enforce teardown even after cancellation or setup failure
        if: ${{ always() && steps.relevance.outputs.relevant == 'true' }}
        env:
          PREVIEW_CONTAINER: buh-ui-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          mkdir -p artifacts/ui-preview
          docker rm --force "${PREVIEW_CONTAINER}" \
            >>artifacts/ui-preview/teardown.log 2>&1
          docker compose --project-name "${BUH_COMPOSE_PROJECT}" \
            -f platform/testenv/compose.yml \
            down --volumes --remove-orphans \
            >>artifacts/ui-preview/teardown.log 2>&1

      - name: Verify exact-head preview evidence and write its manifest
        id: artifact_guard
        if: steps.relevance.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ARTIFACT: ui-preview-pr-${{ steps.target.outputs.pr }}-${{ steps.target.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREVIEW_EVENT: ${{ github.event_name }}
          PREVIEW_HEAD_REPOSITORY: ${{ steps.target.outputs.head_repository }}
          PREVIEW_PR: ${{ steps.target.outputs.pr }}
          PREVIEW_REF: ${{ steps.target.outputs.head_sha }}
          PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PREVIEW_RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${PREVIEW_REF}" ]]
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PREVIEW_PR}" --jq '.head.sha')"
          [[ "${current}" == "${PREVIEW_REF}" ]]
          python3 - <<'PY'
          import json
          import os
          import stat
          from pathlib import Path
          from ops.readiness import _verify_png

          root = Path("artifacts/ui-preview")
          total = 0
          inventory = []
          for path in root.rglob("*"):
              mode = path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"Artifact tree contains a symlink: {path}")
              if stat.S_ISDIR(mode):
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"Artifact tree contains a special file: {path}")
              size = path.stat().st_size
              if size > 64 * 1024 * 1024:
                  raise SystemExit(f"Artifact file exceeds 64 MiB: {path}")
              total += size
              inventory.append(path.relative_to(root).as_posix())
          if total > 256 * 1024 * 1024:
              raise SystemExit("Preview artifact tree exceeds 256 MiB")
          screenshots = sorted(
              path for path in inventory
              if path.startswith("screenshots/") and path.endswith(".png")
          )
          if not any(path.startswith("screenshots/desktop/") for path in screenshots):
              raise SystemExit("Preview artifact lacks desktop screenshots")
          if not any(path.startswith("screenshots/mobile/") for path in screenshots):
              raise SystemExit("Preview artifact lacks mobile screenshots")
          for theme in ("darkly", "flatly", "materia", "bootstrap", "bootstrap-dark"):
              for viewport in ("desktop", "mobile"):
                  prefix = f"screenshots/themes/{theme}/{viewport}/"
                  if not any(path.startswith(prefix) for path in screenshots):
                      raise SystemExit(f"Preview artifact lacks {theme} {viewport} screenshots")
          for relative in screenshots:
              _verify_png((root / relative).read_bytes(), relative)
          report = "playwright-report/index.html"
          if report not in inventory:
              raise SystemExit("Preview artifact lacks the Playwright HTML report")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr": int(os.environ["PREVIEW_PR"]),
              "head_sha": os.environ["PREVIEW_REF"],
              "head_repository": os.environ["PREVIEW_HEAD_REPOSITORY"],
              "event": os.environ["PREVIEW_EVENT"],
              "workflow": ".github/workflows/ui-preview.yml",
              "run_id": int(os.environ["PREVIEW_RUN_ID"]),
              "run_attempt": int(os.environ["PREVIEW_RUN_ATTEMPT"]),
              "evidence_artifact": os.environ["PREVIEW_ARTIFACT"],
              "data": "synthetic-only",
              "network": "compose-internal-only",
              "screenshots": screenshots,
              "playwright_report": report,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY

      - name: Upload the short-lived synthetic preview
        if: ${{ success() && steps.artifact_guard.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-preview-pr-${{ steps.target.outputs.pr }}-${{ steps.target.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ui-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the bounded provenance manifest
        if: ${{ success() && steps.artifact_guard.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-preview-pr-${{ steps.target.outputs.pr }}-${{ steps.target.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: artifacts/ui-preview/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record that no preview is applicable
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "No preview-relevant paths or ui-preview override were present." >>"${GITHUB_STEP_SUMMARY}"
