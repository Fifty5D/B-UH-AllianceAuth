name: Staged SSO incident report checks

on:
  push:
    branches: [incident/staged-sso-owner-report]
    paths: [ops/incidents/**, .github/workflows/incident-sso-report-checks.yml]
  pull_request:
    paths: [ops/incidents/**, .github/workflows/incident-sso-report-checks.yml]

permissions:
  contents: read

concurrency:
  group: incident-sso-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary_checks:
    name: Report boundaries and launcher syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and test the isolated evidence boundaries
        run: |
          python3 -m compileall -q ops/incidents
          python3 -m unittest ops.incidents.test_evidence ops.incidents.test_structures_boundaries ops.incidents.test_structures_launcher ops.incidents.test_retained_recovery -v
      - name: Parse the PowerShell launcher
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          foreach ($launcher in @('run-sso-incident.ps1', 'run-structures-pilot.ps1', 'run-structures-batch.ps1', 'test_structures_batch.ps1', 'run-retained-recovery.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location).Path ('ops/incidents/' + $launcher)),
              [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              throw 'PowerShell launcher failed syntax validation.'
            }
          }
      - name: Verify bounded batch stop policy without SSH or HTTP
        shell: pwsh
        run: ./ops/incidents/test_structures_batch.ps1
      - name: Record tested file hashes
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ("collect_sso_incident.py", "database_report.py", "run-sso-incident.ps1", "run_structures_pilot.py", "structures_recovery.py", "run-structures-pilot.ps1", "run-structures-batch.ps1", "reconcile_structures_attempt.py", "run-retained-recovery.ps1"):
              path = Path("ops/incidents") / name
              print("TESTED_FILE_SHA256", name, hashlib.sha256(path.read_bytes()).hexdigest())
          PY

  model_checks:
    name: Read-only report on real pinned Django models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: mariadb:11.8@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
        env:
          MARIADB_ROOT_PASSWORD: test-only-root
          MARIADB_DATABASE: buh_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            platform/requirements/build.lock
            platform/requirements/test.lock
      - name: Install existing pinned source-test dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential default-libmysqlclient-dev pkg-config
          python -m pip install --require-hashes -r platform/requirements/build.lock
          python -m pip install --require-hashes --no-build-isolation --only-binary=:all: \
            --no-binary=celery-once,django-bootstrap-form,mysqlclient -r platform/requirements/test.lock
          python -m pip install --no-index --no-deps releases/moon-tax/v0.3.3/*.whl
          python -m pip install --no-build-isolation --no-deps \
            -e apps/structure-ops -e apps/mining-analytics -e apps/moon-tax \
            -e apps/esi-history -e apps/memberaudit-autoreg -e apps/vps-health
          python -m pip check
      - name: Exercise actual Auth, Token, OwnerCharacter and Member Audit rows
        run: |
          set -Eeuo pipefail
          ruff check ops/incidents
          export PYTHONPATH="$PWD/platform/testauth:$PWD"
          export BUH_TEST_SETTINGS=testauth.settings.unit
          python platform/testauth/manage.py test --noinput --no-color ops.incidents.django_checks ops.incidents.structures_checks
      - name: Exercise fresh MariaDB sessions and the production shell invocation
        env:
          BUH_TEST_SETTINGS: testauth.settings.integration
          BUH_DB_HOST: 127.0.0.1
          BUH_DB_USER: root
          BUH_DB_PASSWORD: test-only-root
          BUH_REDIS_URL: redis://127.0.0.1:6379
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/platform/testauth:$PWD"
          python platform/testauth/manage.py test --noinput --no-color ops.incidents.django_checks ops.incidents.structures_checks
