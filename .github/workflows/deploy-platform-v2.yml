name: Deploy Platform v2

on:
  workflow_call:
    inputs:
      mode:
        description: Validate only, or perform the guarded production deployment
        required: true
        type: string
      platform_version:
        description: Exact published platform version without a leading v
        required: true
        type: string
      release_commit:
        description: Exact 40-character commit at the published release branch tip
        required: true
        type: string
      confirmation:
        description: Exact preflight or deployment confirmation phrase
        required: true
        type: string
      feature_pr_number:
        description: Approved feature PR for the normal production path
        required: false
        default: ""
        type: string
      feature_head_sha:
        description: Exact approved feature head for the normal production path
        required: false
        default: ""
        type: string
      source_commit:
        description: Exact tested main merge for the normal production path
        required: false
        default: ""
        type: string
      feature_readiness:
        description: Canonical live-verified feature-readiness attestation
        required: false
        default: ""
        type: string
      main_validation_run_id:
        description: Exact approved main Validate PR workflow run
        required: false
        default: ""
        type: string
      main_validation_run_attempt:
        description: Exact approved main Validate PR workflow run attempt
        required: false
        default: ""
        type: string
      manifest_sha256:
        description: Exact approved immutable release manifest hash
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Approved no-change preflight workflow run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Approved no-change preflight workflow run attempt
        required: false
        default: ""
        type: string
      preflight_artifact:
        description: Approved retained no-change preflight artifact name
        required: false
        default: ""
        type: string
      preflight_artifact_id:
        description: Approved retained no-change preflight artifact ID
        required: false
        default: ""
        type: string
      preflight_artifact_digest:
        description: Approved retained no-change preflight artifact digest
        required: false
        default: ""
        type: string
      sync_validation_run_id:
        description: Exact approved synchronization PR Validate PR workflow run
        required: false
        default: ""
        type: string
      sync_validation_run_attempt:
        description: Exact approved synchronization PR Validate PR run attempt
        required: false
        default: ""
        type: string
    secrets:
      BUH_DEPLOY_SSH_KEY:
        description: Forced-command Platform v2 deploy identity
        required: false
      BUH_OBSERVER_SSH_KEY:
        description: Read-only production observer identity
        required: false
      BUH_VPS_KNOWN_HOSTS:
        description: Pinned VPS SSH host key
        required: false
      BUH_VPS_HOST:
        description: Optional secret fallback for the VPS host
        required: false
      BUH_VPS_PORT:
        description: Optional secret fallback for the VPS SSH port
        required: false
      BUH_OBSERVER_USER:
        description: Optional secret fallback for the observer user
        required: false
    outputs:
      artifact_name:
        description: Sanitized retained diagnostic artifact
        value: ${{ jobs.deploy.outputs.artifact_name }}
      manifest_sha256:
        description: Exact deployed release manifest hash
        value: ${{ jobs.deploy.outputs.manifest_sha256 }}
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or perform the guarded production deployment
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - deploy
      platform_version:
        description: Exact published platform version without a leading v
        required: true
        type: string
      release_commit:
        description: Exact 40-character commit at the published release branch tip
        required: true
        type: string
      confirmation:
        description: Type PREFLIGHT PLATFORM V2 or DEPLOY PLATFORM V2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buh-production-platform-v2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Guarded Platform v2 operation
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: production
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}
    steps:
      - name: Validate caller, mode, version, and immutable release ref
        env:
          ACTOR: ${{ github.actor }}
          API_URL: ${{ github.api_url }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          FEATURE_HEAD_SHA: ${{ inputs.feature_head_sha }}
          FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          FEATURE_READINESS: ${{ inputs.feature_readiness }}
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_VALIDATION_RUN_ATTEMPT: ${{ inputs.main_validation_run_attempt }}
          MAIN_VALIDATION_RUN_ID: ${{ inputs.main_validation_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          PREFLIGHT_ARTIFACT: ${{ inputs.preflight_artifact }}
          PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.preflight_artifact_digest }}
          PREFLIGHT_ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SYNC_VALIDATION_RUN_ATTEMPT: ${{ inputs.sync_validation_run_attempt }}
          SYNC_VALIDATION_RUN_ID: ${{ inputs.sync_validation_run_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          fi
          is_release_actor() {
            [[ "$1" == "${OWNER}" || (-n "${WORK_ACTOR}" && "$1" == "${WORK_ACTOR}") ]]
          }
          case "${EVENT_NAME}:${MODE}" in
            workflow_run:preflight)
              is_release_actor "${ACTOR}"
              is_release_actor "${TRIGGERING_ACTOR}"
              [[ -z "${FEATURE_PR_NUMBER}" && -z "${FEATURE_HEAD_SHA}" &&
                 -z "${SOURCE_COMMIT}" && -z "${FEATURE_READINESS}" &&
                 -z "${MAIN_VALIDATION_RUN_ID}" &&
                 -z "${MAIN_VALIDATION_RUN_ATTEMPT}" &&
                 -z "${MANIFEST_SHA256}" &&
                 -z "${PREFLIGHT_RUN_ID}" && -z "${PREFLIGHT_RUN_ATTEMPT}" &&
                 -z "${PREFLIGHT_ARTIFACT}" && -z "${PREFLIGHT_ARTIFACT_ID}" &&
                 -z "${PREFLIGHT_ARTIFACT_DIGEST}" &&
                 -z "${SYNC_VALIDATION_RUN_ID}" &&
                 -z "${SYNC_VALIDATION_RUN_ATTEMPT}" ]]
              ;;
            pull_request_target:deploy)
              [[ "${ACTOR}" == "${OWNER}" ]]
              [[ "${TRIGGERING_ACTOR}" == "${OWNER}" ]]
              [[ "${FEATURE_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
              [[ "${FEATURE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
              [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
              [[ -n "${FEATURE_READINESS}" ]]
              [[ "${MAIN_VALIDATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${MAIN_VALIDATION_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              [[ "${MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${PREFLIGHT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${PREFLIGHT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              [[ "${PREFLIGHT_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${PREFLIGHT_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${PREFLIGHT_ARTIFACT}" == \
                 "platform-v2-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" ]]
              [[ "${SYNC_VALIDATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              [[ "${SYNC_VALIDATION_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              ;;
            workflow_dispatch:preflight|workflow_dispatch:deploy)
              [[ "${ACTOR}" == "${OWNER}" ]]
              [[ "${TRIGGERING_ACTOR}" == "${OWNER}" ]]
              [[ -z "${FEATURE_PR_NUMBER}" && -z "${FEATURE_HEAD_SHA}" &&
                 -z "${SOURCE_COMMIT}" && -z "${FEATURE_READINESS}" &&
                 -z "${MAIN_VALIDATION_RUN_ID}" &&
                 -z "${MAIN_VALIDATION_RUN_ATTEMPT}" &&
                 -z "${MANIFEST_SHA256}" &&
                 -z "${PREFLIGHT_RUN_ID}" && -z "${PREFLIGHT_RUN_ATTEMPT}" &&
                 -z "${PREFLIGHT_ARTIFACT}" && -z "${PREFLIGHT_ARTIFACT_ID}" &&
                 -z "${PREFLIGHT_ARTIFACT_DIGEST}" &&
                 -z "${SYNC_VALIDATION_RUN_ID}" &&
                 -z "${SYNC_VALIDATION_RUN_ATTEMPT}" ]]
              ;;
            *)
              echo "This event is not authorized for the requested operation." >&2
              exit 64
              ;;
          esac
          [[ "${SELECTED_REF}" == "refs/heads/main" ]]
          [[ "${PLATFORM_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          case "${MODE}" in
            preflight) [[ "${CONFIRMATION}" == "PREFLIGHT PLATFORM V2" ]] ;;
            deploy) [[ "${CONFIRMATION}" == "DEPLOY PLATFORM V2" ]] ;;
            *) exit 64 ;;
          esac

          mkdir -p artifacts
          ref_url="${API_URL}/repos/${REPOSITORY}/git/ref/heads/release/platform-v${PLATFORM_VERSION}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${ref_url}" >artifacts/release-ref.json
          [[ "$(jq -er '.object.type' artifacts/release-ref.json)" == "commit" ]]
          [[ "$(jq -er '.object.sha' artifacts/release-ref.json)" == "${RELEASE_COMMIT}" ]]

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/git/commits/${RELEASE_COMMIT}" \
            >artifacts/release-commit.json
          [[ "$(jq -er '.parents | length' artifacts/release-commit.json)" == "1" ]]

      - name: Check out the exact published release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
          # Recovery archives verify every immutable release in the fixed
          # lineage locally before any request crosses the SSH boundary.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release lineage, bundle, and production compatibility
        id: release
        env:
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          mapfile -t parents < <(git show -s --format='%P' HEAD)
          read -r -a parent_ids <<<"${parents[0]}"
          [[ "${#parent_ids[@]}" -eq 1 ]]

          release_dir="releases/platform/v${PLATFORM_VERSION}"
          [[ -d "${release_dir}" && ! -L "${release_dir}" ]]
          python3 ops/release/buh_release.py verify --release-dir "${release_dir}"

          RELEASE_DIR="${release_dir}" python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          release = Path(os.environ["RELEASE_DIR"])
          manifest = json.loads((release / "RELEASE.json").read_text(encoding="ascii"))
          version = os.environ["PLATFORM_VERSION"]
          commit = os.environ["RELEASE_COMMIT"]
          if manifest.get("platform_version") != version:
              raise SystemExit("Release directory and manifest version disagree")
          source = manifest.get("source_commit")
          if not isinstance(source, str) or not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("Manifest source commit is not a full GitHub commit")
          parent = subprocess.run(
              ["git", "rev-parse", f"{commit}^"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout.strip()
          if source != parent:
              raise SystemExit("Published release is not a direct child of its tested source")
          runtime = manifest.get("compatibility", {}).get("values", {}).get(
              "production_runtime"
          )
          image = runtime.get("base_image") if isinstance(runtime, dict) else None
          if not isinstance(image, str) or not re.fullmatch(
              r"[a-z0-9]+(?:[._/-][a-z0-9]+)*(?::[A-Za-z0-9][A-Za-z0-9._-]{0,127})?"
              r"@sha256:[0-9a-f]{64}",
              image,
          ):
              raise SystemExit("Release lacks its reviewed digest-pinned production image")

          tracked = subprocess.run(
              ["git", "ls-tree", "-r", "-z", "--full-tree", commit, "--", release.as_posix()],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")
          expected = {path.relative_to(release).as_posix() for path in release.iterdir()}
          actual = set()
          for record in tracked:
              if not record:
                  continue
              header, name = record.split(b"\t", 1)
              mode, kind, _object_id = header.decode("ascii").split()
              path = Path(name.decode("utf-8"))
              if mode != "100644" or kind != "blob" or path.parent != release:
                  raise SystemExit(f"Unsafe release-tree entry: {path}")
              actual.add(path.name)
          if actual != expected:
              raise SystemExit("Release filesystem and exact Git tree differ")
          PY

          manifest_sha256="$(sha256sum "${release_dir}/RELEASE.json" | awk '{print $1}')"
          [[ "${manifest_sha256}" =~ ^[0-9a-f]{64}$ ]]
          echo "release_dir=${release_dir}" >>"${GITHUB_OUTPUT}"
          echo "manifest_sha256=${manifest_sha256}" >>"${GITHUB_OUTPUT}"

      - name: Build a deterministic bounded deployment archive
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_DIR: ${{ steps.release.outputs.release_dir }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 ops/deploy/request_archive.py \
            --root . \
            --release-dir "${RELEASE_DIR}" \
            --repository "${REPOSITORY}" \
            --release-commit "${RELEASE_COMMIT}" \
            --mode "${MODE}" \
            --workflow-run-id "${RUN_ID}" \
            --workflow-run-attempt "${RUN_ATTEMPT}" \
            --output platform-v2-deployment.tar.gz \
            --metadata-output artifacts/deployment-request.json >/dev/null

      - name: Verify every recovery release ref and source parent
        env:
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          jq -c '.release_refs[]' artifacts/deployment-request.json |
          while IFS= read -r identity; do
            version="$(jq -er '.platform_version' <<<"${identity}")"
            expected_release="$(jq -er '.release_commit' <<<"${identity}")"
            expected_source="$(jq -er '.source_commit' <<<"${identity}")"
            ref_response="${RUNNER_TEMP}/release-ref-${version}.json"
            commit_response="${RUNNER_TEMP}/release-commit-${version}.json"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/git/ref/heads/release/platform-v${version}" \
              >"${ref_response}"
            [[ "$(jq -er '.object.type' "${ref_response}")" == "commit" ]]
            [[ "$(jq -er '.object.sha' "${ref_response}")" == "${expected_release}" ]]
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/git/commits/${expected_release}" \
              >"${commit_response}"
            [[ "$(jq -er '.parents | length' "${commit_response}")" == "1" ]]
            [[ "$(jq -er '.parents[0].sha' "${commit_response}")" == "${expected_source}" ]]
          done

      - name: Reauthorize the queued production operation
        if: ${{ github.event_name == 'pull_request_target' && inputs.mode == 'deploy' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREFLIGHT_ARTIFACT: ${{ inputs.preflight_artifact }}
          PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.preflight_artifact_digest }}
          PREFLIGHT_ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          set -Eeuo pipefail
          python3 ops/release/platform_approval.py authorize \
            --owner "${{ github.repository_owner }}" \
            --repository "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --triggering-actor "${{ github.triggering_actor }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --event "${GITHUB_EVENT_PATH}" \
            --api-url "${{ github.api_url }}" \
            --server-url "${{ github.server_url }}" \
            --output build/platform-deploy-boundary-initial.json >/dev/null
          jq -e \
            --arg artifact "${PREFLIGHT_ARTIFACT}" \
            --arg digest "${PREFLIGHT_ARTIFACT_DIGEST}" \
            --argjson artifact_id "${PREFLIGHT_ARTIFACT_ID}" \
            --argjson run_attempt "${PREFLIGHT_RUN_ATTEMPT}" \
            --argjson run_id "${PREFLIGHT_RUN_ID}" '
              .preflight_artifact == $artifact and
              .preflight_artifact_digest == $digest and
              .preflight_artifact_id == $artifact_id and
              .preflight_run_attempt == $run_attempt and
              .preflight_run_id == $run_id
            ' build/platform-deploy-boundary-initial.json >/dev/null

      - name: Download the still-retained production preflight artifact
        if: ${{ github.event_name == 'pull_request_target' && inputs.mode == 'deploy' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.preflight_artifact_id }}
          path: build/production-boundary-preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
          merge-multiple: true

      - name: Reverify live feature readiness at the production boundary
        if: ${{ github.event_name == 'pull_request_target' && inputs.mode == 'deploy' }}
        env:
          EXPECTED_FEATURE_READINESS: ${{ inputs.feature_readiness }}
          FEATURE_HEAD_SHA: ${{ inputs.feature_head_sha }}
          FEATURE_PR_NUMBER: ${{ inputs.feature_pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_VALIDATION_RUN_ATTEMPT: ${{ inputs.main_validation_run_attempt }}
          MAIN_VALIDATION_RUN_ID: ${{ inputs.main_validation_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          PREFLIGHT_ARTIFACT: ${{ inputs.preflight_artifact }}
          PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.preflight_artifact_digest }}
          PREFLIGHT_ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_MANIFEST_SHA256: ${{ steps.release.outputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SYNC_VALIDATION_RUN_ATTEMPT: ${{ inputs.sync_validation_run_attempt }}
          SYNC_VALIDATION_RUN_ID: ${{ inputs.sync_validation_run_id }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          python3 ops/release/platform_approval.py verify-artifact \
            --report build/platform-deploy-boundary-initial.json \
            --artifact-dir build/production-boundary-preflight >/dev/null
          [[ "$(git rev-parse HEAD^)" == "${SOURCE_COMMIT}" ]]
          [[ "${MANIFEST_SHA256}" == "${RELEASE_MANIFEST_SHA256}" ]]
          expected="${RUNNER_TEMP}/approved-feature-readiness.json"
          current="${RUNNER_TEMP}/current-feature-readiness.json"
          EXPECTED_PATH="${expected}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["EXPECTED_FEATURE_READINESS"]
          value = json.loads(raw)
          canonical = json.dumps(value, sort_keys=True, separators=(",", ":"))
          if raw != canonical:
              raise SystemExit("Approved feature readiness is not canonical")
          Path(os.environ["EXPECTED_PATH"]).write_text(
              canonical + "\n", encoding="ascii"
          )
          PY
          allowed_mergers=(--allowed-merger "${REPOSITORY_OWNER}")
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
            allowed_mergers+=(--allowed-merger "${WORK_ACTOR}")
          fi
          first_introduction=()
          if [[ "${FEATURE_PR_NUMBER}" == "44" ]]; then
            first_introduction=(--allow-first-introduction --first-introduction-pr 44)
          fi
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request "${FEATURE_PR_NUMBER}" \
            --feature-head "${FEATURE_HEAD_SHA}" \
            --merge-source-commit "${SOURCE_COMMIT}" \
            "${allowed_mergers[@]}" \
            "${first_introduction[@]}" \
            --api-url "${GITHUB_API_URL}" \
            --output "${current}" >/dev/null
          cmp --silent "${expected}" "${current}"
          # This is deliberately the final remote read before SSH materialization.
          # It closes concurrency-queue, artifact deletion/expiry, and approval
          # replacement races after the potentially slower readiness verification.
          python3 ops/release/platform_approval.py authorize \
            --owner "${{ github.repository_owner }}" \
            --repository "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --triggering-actor "${{ github.triggering_actor }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --event "${GITHUB_EVENT_PATH}" \
            --api-url "${{ github.api_url }}" \
            --server-url "${{ github.server_url }}" \
            --output build/platform-deploy-boundary-final.json >/dev/null
          cmp --silent \
            build/platform-deploy-boundary-initial.json \
            build/platform-deploy-boundary-final.json
          APPROVAL_PATH=build/platform-deploy-boundary-final.json \
          CURRENT_PATH="${current}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          approval = json.loads(Path(os.environ["APPROVAL_PATH"]).read_text(encoding="ascii"))
          current = json.loads(Path(os.environ["CURRENT_PATH"]).read_text(encoding="ascii"))
          expected = {
              "feature_head_sha": os.environ["FEATURE_HEAD_SHA"],
              "feature_pr_number": int(os.environ["FEATURE_PR_NUMBER"]),
              "main_validation_run_attempt": int(
                  os.environ["MAIN_VALIDATION_RUN_ATTEMPT"]
              ),
              "main_validation_run_id": int(os.environ["MAIN_VALIDATION_RUN_ID"]),
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "platform_version": os.environ["PLATFORM_VERSION"],
              "preflight_artifact": os.environ["PREFLIGHT_ARTIFACT"],
              "preflight_artifact_digest": os.environ["PREFLIGHT_ARTIFACT_DIGEST"],
              "preflight_artifact_id": int(os.environ["PREFLIGHT_ARTIFACT_ID"]),
              "preflight_run_attempt": int(os.environ["PREFLIGHT_RUN_ATTEMPT"]),
              "preflight_run_id": int(os.environ["PREFLIGHT_RUN_ID"]),
              "release_commit": os.environ["RELEASE_COMMIT"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sync_validation_run_attempt": int(
                  os.environ["SYNC_VALIDATION_RUN_ATTEMPT"]
              ),
              "sync_validation_run_id": int(os.environ["SYNC_VALIDATION_RUN_ID"]),
          }
          for key, value in expected.items():
              if approval.get(key) != value:
                  raise SystemExit(f"Queued production approval changed {key}")
          if approval.get("feature_readiness") != current:
              raise SystemExit("Queued production approval changed feature readiness")
          PY

      - name: Configure guarded deploy and observer SSH identities
        env:
          DEPLOY_KEY: ${{ secrets.BUH_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BUH_VPS_KNOWN_HOSTS }}
          OBSERVER_KEY: ${{ secrets.BUH_OBSERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          test -n "${DEPLOY_KEY}" || { echo "Deploy identity is not configured." >&2; exit 78; }
          test -n "${OBSERVER_KEY}" || { echo "Observer identity is not configured." >&2; exit 78; }
          test -n "${KNOWN_HOSTS}" || { echo "Known hosts are not configured." >&2; exit 78; }
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" >"${HOME}/.ssh/buh_deployer"
          printf '%s\n' "${OBSERVER_KEY}" >"${HOME}/.ssh/buh_observer"
          printf '%s\n' "${KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/buh_deployer" \
            "${HOME}/.ssh/buh_observer" "${HOME}/.ssh/known_hosts"

      - name: Send the verified archive through the forced command
        id: receiver
        env:
          DEPLOY_USER: ${{ vars.BUH_DEPLOY_USER || 'buh-deployer' }}
          MODE: ${{ inputs.mode }}
          VPS_HOST: ${{ vars.BUH_VPS_HOST || secrets.BUH_VPS_HOST || '74.208.147.52' }}
          VPS_PORT: ${{ vars.BUH_VPS_PORT || secrets.BUH_VPS_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          : >artifacts/receiver.raw.txt
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            -i "${HOME}/.ssh/buh_deployer" -p "${VPS_PORT}" \
            "${DEPLOY_USER}@${VPS_HOST}" "${MODE} platform-v2" \
            <platform-v2-deployment.tar.gz >artifacts/receiver.raw.txt 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >>"${GITHUB_OUTPUT}"

      - name: Collect post-operation observer diagnostics
        id: observer
        if: always()
        env:
          OBSERVER_USER: ${{ vars.BUH_OBSERVER_USER || secrets.BUH_OBSERVER_USER || 'buh-observer' }}
          VPS_HOST: ${{ vars.BUH_VPS_HOST || secrets.BUH_VPS_HOST || '74.208.147.52' }}
          VPS_PORT: ${{ vars.BUH_VPS_PORT || secrets.BUH_VPS_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          : >artifacts/diagnostics.raw.txt
          : >artifacts/attempt.raw.txt
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i "${HOME}/.ssh/buh_observer" -p "${VPS_PORT}" \
            "${OBSERVER_USER}@${VPS_HOST}" "diagnostics 15" \
            >artifacts/diagnostics.raw.txt 2>&1
          diagnostics_code=$?
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i "${HOME}/.ssh/buh_observer" -p "${VPS_PORT}" \
            "${OBSERVER_USER}@${VPS_HOST}" \
            "attempt gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >artifacts/attempt.raw.txt 2>&1
          attempt_code=$?
          set -e
          echo "diagnostics_exit_code=${diagnostics_code}" >>"${GITHUB_OUTPUT}"
          echo "attempt_exit_code=${attempt_code}" >>"${GITHUB_OUTPUT}"

      - name: Sanitize and validate retained diagnostics
        id: sanitize
        if: always()
        run: |
          set -Eeuo pipefail
          for source in \
            artifacts/receiver.raw.txt \
            artifacts/diagnostics.raw.txt \
            artifacts/attempt.raw.txt; do
            target="${source/.raw/}"
            python3 ops/buh-redact-diagnostics.py "${source}" >"${target}"
            python3 ops/buh-redact-diagnostics.py --validate "${target}"
            rm -f -- "${source}"
          done
          python3 - <<'PY'
          import stat
          from pathlib import Path

          root = Path("artifacts")
          total = 0
          for path in root.rglob("*"):
              mode = path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"Artifact tree contains a symlink: {path}")
              if stat.S_ISDIR(mode):
                  continue
              if not stat.S_ISREG(mode) or path.stat().st_size > 16 * 1024 * 1024:
                  raise SystemExit(f"Unsafe diagnostic artifact: {path}")
              total += path.stat().st_size
          if total > 32 * 1024 * 1024:
              raise SystemExit("Diagnostic artifacts exceed their aggregate limit")
          PY

      - name: Name the retained diagnostic artifact
        id: artifact
        if: always() && steps.sanitize.outcome == 'success'
        run: |
          set -Eeuo pipefail
          echo "name=platform-v2-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}" >>"${GITHUB_OUTPUT}"

      - name: Upload sanitized diagnostics for every attempt
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            artifacts/receiver.txt
            artifacts/diagnostics.txt
            artifacts/attempt.txt
          if-no-files-found: error
          retention-days: 7

      - name: Require receiver, observer, and sanitization success
        if: always()
        env:
          DIAGNOSTICS_EXIT: ${{ steps.observer.outputs.diagnostics_exit_code }}
          ATTEMPT_EXIT: ${{ steps.observer.outputs.attempt_exit_code }}
          RECEIVER_EXIT: ${{ steps.receiver.outputs.exit_code }}
          SANITIZE_OUTCOME: ${{ steps.sanitize.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "${RECEIVER_EXIT}" == "0" ]]
          [[ "${DIAGNOSTICS_EXIT}" == "0" ]]
          [[ "${ATTEMPT_EXIT}" == "0" ]]
          [[ "${SANITIZE_OUTCOME}" == "success" ]]
