name: Prepare Release

on:
  workflow_run:
    workflows: [Validate PR]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: buh-platform-release-automation
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: Qualify successful main source
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      release_needed: ${{ steps.fragments.outputs.release_needed }}
      source_commit: ${{ steps.event.outputs.source_commit }}
      source_validation_run_attempt: ${{ steps.event.outputs.source_validation_run_attempt }}
      source_validation_run_id: ${{ steps.event.outputs.source_validation_run_id }}
      feature_head_sha: ${{ steps.lineage.outputs.feature_head_sha }}
      feature_pr_number: ${{ steps.lineage.outputs.feature_pr_number }}
      feature_readiness: ${{ steps.readiness.outputs.feature_readiness }}
    steps:
      - name: Validate the trusted Validate PR completion
        id: event
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -Eeuo pipefail
          [[ "${RUN_ATTEMPT}" == "1" ]]
          [[ "${SOURCE_RUN_ATTEMPT}" == "1" ]]
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${WORKFLOW_NAME}" == "Validate PR" ]]
          [[ "${WORKFLOW_PATH%%@*}" == ".github/workflows/source-ci.yml" ]]
          [[ "${STATUS}" == "completed" && "${CONCLUSION}" == "success" ]]
          [[ "${EVENT}" == "push" && "${HEAD_BRANCH}" == "main" ]]
          [[ "${HEAD_REPOSITORY}" == "${REPOSITORY}" ]]
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          echo "source_commit=${SOURCE_COMMIT}" >>"${GITHUB_OUTPUT}"
          echo "source_validation_run_attempt=${SOURCE_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
          echo "source_validation_run_id=${SOURCE_RUN_ID}" >>"${GITHUB_OUTPUT}"
          # Release only the newest tested main. If main advanced, its own Source
          # CI completion will collect every still-unconsumed change fragment.
          if [[ "${CURRENT_MAIN_SHA}" != "${SOURCE_COMMIT}" ]]; then
            echo "release_needed=false" >>"${GITHUB_OUTPUT}"
            echo "main advanced; its newer Validate PR run owns release automation." >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Check out the exact tested source
        if: ${{ steps.event.outputs.release_needed != 'false' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.event.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Detect unconsumed release intent
        id: fragments
        if: ${{ steps.event.outputs.release_needed != 'false' }}
        env:
          SOURCE_COMMIT: ${{ steps.event.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]
          mapfile -d '' fragments < <(git ls-files -z -- 'changes/*.toml')
          for fragment in "${fragments[@]}"; do
            [[ "${fragment}" =~ ^changes/[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.toml$ ]]
            [[ -f "${fragment}" && ! -L "${fragment}" ]]
          done
          if [[ "${#fragments[@]}" -eq 0 ]]; then
            echo "release_needed=false" >>"${GITHUB_OUTPUT}"
            echo "No unconsumed change fragments; release automation is complete." >>"${GITHUB_STEP_SUMMARY}"
          else
            echo "release_needed=true" >>"${GITHUB_OUTPUT}"
            echo "Found ${#fragments[@]} unconsumed change fragment(s)." >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Derive the one exact merged feature pull request
        id: lineage
        if: ${{ steps.fragments.outputs.release_needed == 'true' }}
        env:
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.event.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/feature-lineage-pages
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/commits/${SOURCE_COMMIT}" \
            >build/feature-merge-commit.json
          page=1
          while :; do
            response="build/feature-lineage-pages/page-${page}.json"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/commits/${SOURCE_COMMIT}/pulls?per_page=100&page=${page}" \
              >"${response}"
            page_count="$(jq -er 'length' "${response}")"
            [[ "${page_count}" =~ ^[0-9]+$ ]]
            if [[ "${page_count}" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
            if [[ "${page}" -gt 100 ]]; then
              echo "Feature pull-request association pagination exceeded its bound." >&2
              exit 1
            fi
          done
          jq -s 'add' build/feature-lineage-pages/page-*.json \
            >build/feature-pulls.json

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          commit = json.loads(
              Path("build/feature-merge-commit.json").read_text(encoding="utf-8")
          )
          pulls = json.loads(
              Path("build/feature-pulls.json").read_text(encoding="utf-8")
          )
          repository = os.environ["REPOSITORY"]
          source = os.environ["SOURCE_COMMIT"]
          parents = commit.get("parents") if isinstance(commit, dict) else None
          if (
              commit.get("sha") != source
              or not isinstance(parents, list)
              or len(parents) != 2
              or any(not isinstance(parent, dict) for parent in parents)
          ):
              raise SystemExit("Tested main source is not one exact two-parent merge")
          first_parent = parents[0].get("sha")
          feature_head = parents[1].get("sha")
          if (
              not isinstance(first_parent, str)
              or not re.fullmatch(r"[0-9a-f]{40}", first_parent)
              or not isinstance(feature_head, str)
              or not re.fullmatch(r"[0-9a-f]{40}", feature_head)
              or first_parent == feature_head
          ):
              raise SystemExit("Tested main merge parents are malformed")
          if not isinstance(pulls, list):
              raise SystemExit("GitHub returned malformed commit-to-PR associations")

          def repo_name(value):
              return value.get("full_name") if isinstance(value, dict) else None

          matches = []
          for pull in pulls:
              if not isinstance(pull, dict):
                  raise SystemExit("GitHub returned a malformed associated pull request")
              head = pull.get("head")
              base = pull.get("base")
              if (
                  isinstance(pull.get("number"), int)
                  and pull["number"] > 0
                  and pull.get("state") == "closed"
                  and pull.get("merged_at") is not None
                  and pull.get("merge_commit_sha") == source
                  and isinstance(head, dict)
                  and head.get("sha") == feature_head
                  and repo_name(head.get("repo")) == repository
                  and isinstance(base, dict)
                  and base.get("ref") == "main"
                  and repo_name(base.get("repo")) == repository
              ):
                  matches.append(pull)
          if len(matches) != 1:
              raise SystemExit(
                  "Tested main merge does not have one exact same-repository feature PR"
              )
          selected = matches[0]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"feature_head_sha={feature_head}", file=output)
              print(f"feature_pr_number={selected['number']}", file=output)
          PY

      - name: Reverify the published feature readiness
        id: readiness
        if: ${{ steps.fragments.outputs.release_needed == 'true' }}
        env:
          FEATURE_HEAD_SHA: ${{ steps.lineage.outputs.feature_head_sha }}
          FEATURE_PR_NUMBER: ${{ steps.lineage.outputs.feature_pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_COMMIT: ${{ steps.event.outputs.source_commit }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          allowed_mergers=(--allowed-merger "${REPOSITORY_OWNER}")
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
            allowed_mergers+=(--allowed-merger "${WORK_ACTOR}")
          fi
          first_introduction=()
          if [[ "${FEATURE_PR_NUMBER}" == "44" ]]; then
            first_introduction=(--allow-first-introduction --first-introduction-pr 44)
          fi
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request "${FEATURE_PR_NUMBER}" \
            --feature-head "${FEATURE_HEAD_SHA}" \
            --merge-source-commit "${SOURCE_COMMIT}" \
            "${allowed_mergers[@]}" \
            "${first_introduction[@]}" \
            --output build/feature-readiness.json >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/feature-readiness.json")
          value = json.loads(path.read_text(encoding="ascii"))
          canonical = json.dumps(value, sort_keys=True, separators=(",", ":"))
          if path.read_text(encoding="ascii") != canonical + "\n":
              raise SystemExit("Published feature readiness is not canonical")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"feature_readiness={canonical}", file=output)
          PY

  release:
    name: Build and publish immutable release
    if: ${{ needs.qualify.outputs.release_needed == 'true' }}
    needs: qualify
    uses: ./.github/workflows/build-platform-release.yml
    with:
      expected_source_sha: ${{ needs.qualify.outputs.source_commit }}
      automatic_release: true
      source_validation_run_id: ${{ needs.qualify.outputs.source_validation_run_id }}
      source_validation_run_attempt: ${{ needs.qualify.outputs.source_validation_run_attempt }}
      feature_pr_number: ${{ needs.qualify.outputs.feature_pr_number }}
      feature_head_sha: ${{ needs.qualify.outputs.feature_head_sha }}
      feature_readiness: ${{ needs.qualify.outputs.feature_readiness }}
      publish_release_branch: true
      publish_confirmation: PUBLISH RELEASE BRANCH
    secrets:
      BUH_RELEASE_PR_TOKEN: ${{ secrets.BUH_RELEASE_PR_TOKEN }}
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write

  preflight:
    name: Run production no-change preflight
    needs: release
    uses: ./.github/workflows/deploy-platform-v2.yml
    with:
      mode: preflight
      platform_version: ${{ needs.release.outputs.platform_version }}
      release_commit: ${{ needs.release.outputs.release_commit }}
      confirmation: PREFLIGHT PLATFORM V2
    secrets: inherit
    permissions:
      contents: read

  ready:
    name: Publish ChatGPT approval evidence
    needs: [release, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify evidence and publish the readiness marker
        id: approval
        env:
          FEATURE_HEAD_SHA: ${{ needs.release.outputs.feature_head_sha }}
          FEATURE_PR_NUMBER: ${{ needs.release.outputs.feature_pr_number }}
          FEATURE_READINESS: ${{ needs.release.outputs.feature_readiness }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_COMMIT: ${{ needs.release.outputs.source_commit }}
          WORK_ACTOR: ${{ vars.BUH_CHATGPT_WORK_ACTOR }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(os.environ["FEATURE_READINESS"])
          encoded = json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
          if os.environ["FEATURE_READINESS"] + "\n" != encoded:
              raise SystemExit("Feature-readiness workflow output is not canonical")
          Path("build/feature-readiness.json").write_text(encoded, encoding="ascii")
          PY
          allowed_mergers=(--allowed-merger "${REPOSITORY_OWNER}")
          if [[ -n "${WORK_ACTOR}" ]]; then
            [[ "${WORK_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
            allowed_mergers+=(--allowed-merger "${WORK_ACTOR}")
          fi
          first_introduction=()
          if [[ "${FEATURE_PR_NUMBER}" == "44" ]]; then
            first_introduction=(--allow-first-introduction --first-introduction-pr 44)
          fi
          python3 ops/readiness.py published \
            --repository "${REPOSITORY}" \
            --pull-request "${FEATURE_PR_NUMBER}" \
            --feature-head "${FEATURE_HEAD_SHA}" \
            --merge-source-commit "${SOURCE_COMMIT}" \
            "${allowed_mergers[@]}" \
            "${first_introduction[@]}" \
            --output build/current-feature-readiness.json >/dev/null
          cmp --silent \
            build/feature-readiness.json \
            build/current-feature-readiness.json
          python3 ops/release/platform_approval.py ready \
            --owner "${{ github.repository_owner }}" \
            --repository "${{ github.repository }}" \
            --version "${{ needs.release.outputs.platform_version }}" \
            --source-commit "${{ needs.release.outputs.source_commit }}" \
            --release-commit "${{ needs.release.outputs.release_commit }}" \
            --pull-request "${{ needs.release.outputs.sync_pr_number }}" \
            --feature-readiness build/current-feature-readiness.json \
            --main-validation-run-id "${{ needs.release.outputs.main_validation_run_id }}" \
            --main-validation-run-attempt "${{ needs.release.outputs.main_validation_run_attempt }}" \
            --manifest-sha256 "${{ needs.preflight.outputs.manifest_sha256 }}" \
            --preflight-run-id "${{ github.run_id }}" \
            --preflight-run-attempt "${{ github.run_attempt }}" \
            --preflight-artifact "${{ needs.preflight.outputs.artifact_name }}" \
            --api-url "${{ github.api_url }}" \
            --server-url "${{ github.server_url }}" \
            --output build/platform-approval-ready.json >/dev/null

      - name: Upload canonical readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-approval-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/platform-approval-ready.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
