name: Build platform release

on:
  workflow_call:
    inputs:
      expected_source_sha:
        description: Exact full main commit SHA (40 or 64 lowercase hex characters)
        required: true
        type: string
      publish_release_branch:
        description: Publish the verified candidate to a new release branch
        required: false
        type: boolean
        default: false
      publish_confirmation:
        description: Exact publication confirmation when publication is enabled
        required: false
        type: string
        default: ""
    secrets:
      BUH_RELEASE_PR_TOKEN:
        description: Owner fine-grained token used only to create the sync PR
        required: false
    outputs:
      platform_version:
        description: Published platform version without a leading v
        value: ${{ jobs.synchronize_release.outputs.platform_version }}
      release_commit:
        description: Exact immutable release commit
        value: ${{ jobs.synchronize_release.outputs.release_commit }}
      source_commit:
        description: Exact tested main commit
        value: ${{ jobs.synchronize_release.outputs.source_commit }}
      sync_pr_number:
        description: Mandatory release synchronization pull request number
        value: ${{ jobs.synchronize_release.outputs.sync_pr_number }}
      sync_pr_url:
        description: Mandatory release synchronization pull request URL
        value: ${{ jobs.synchronize_release.outputs.sync_pr_url }}
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact full main commit SHA (40 or 64 lowercase hex characters)
        required: true
        type: string
      publish_release_branch:
        description: Publish the verified candidate to a new release branch
        required: false
        type: boolean
        default: false
      publish_confirmation:
        description: Type PUBLISH RELEASE BRANCH when publication is enabled
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish_release_branch && 'buh-platform-release-publication' || format('buh-platform-release-candidate-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source_gate:
    name: Require exact-SHA Source CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_attempt: ${{ steps.source_ci.outputs.run_attempt }}
      run_id: ${{ steps.source_ci.outputs.run_id }}
      run_url: ${{ steps.source_ci.outputs.run_url }}
    steps:
      - name: Find the newest exact-SHA main Source CI run
        id: source_ci
        env:
          API_URL: ${{ github.api_url }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${EXPECTED_SOURCE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "expected_source_sha must be a full lowercase Git ID." >&2
            exit 1
          fi
          [[ "${DISPATCH_REF}" == "refs/heads/main" ]]
          [[ "${DISPATCH_SHA}" == "${EXPECTED_SOURCE_SHA}" ]]

          mkdir -p build/source-ci-pages
          page=1
          while :; do
            response="build/source-ci-pages/page-${page}.json"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/actions/workflows/source-ci.yml/runs?branch=main&event=push&head_sha=${EXPECTED_SOURCE_SHA}&per_page=100&page=${page}" \
              >"${response}"
            page_count="$(jq -er '.workflow_runs | length' "${response}")"
            [[ "${page_count}" =~ ^[0-9]+$ ]]
            if [[ "${page_count}" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
            if [[ "${page}" -gt 100 ]]; then
              echo "Too many Source CI result pages; refusing an incomplete decision." >&2
              exit 1
            fi
          done

          jq -s '{workflow_runs: [.[].workflow_runs[]]}' \
            build/source-ci-pages/page-*.json >build/source-ci-runs.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("build/source-ci-runs.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          repository = os.environ["REPOSITORY"]
          runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == expected
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and isinstance(run.get("path"), str)
              and run["path"].split("@", 1)[0] == ".github/workflows/source-ci.yml"
              and (run.get("head_repository") or {}).get("full_name") == repository
              and isinstance(run.get("id"), int)
          ]
          if not runs:
              raise SystemExit(
                  "No Source CI push run exists for expected_source_sha"
              )
          selected = max(
              runs,
              key=lambda run: (
                  int(run.get("run_number", 0)),
                  int(run.get("run_attempt", 0)),
                  run["id"],
              ),
          )
          if (
              selected.get("status") != "completed"
              or selected.get("conclusion") != "success"
          ):
              raise SystemExit(
                  "The newest exact-SHA Source CI run did not complete successfully"
              )
          run_id = selected["id"]
          run_attempt = int(selected.get("run_attempt", 0))
          if run_attempt < 1:
              raise SystemExit("Newest Source CI run has an invalid attempt number")
          run_url = (
              f"{os.environ['SERVER_URL']}/{repository}/actions/runs/{run_id}"
              f"/attempts/{run_attempt}"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"run_attempt={run_attempt}", file=output)
              print(f"run_id={run_id}", file=output)
              print(f"run_url={run_url}", file=output)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as summary:
              print("### Verified Source CI provenance", file=summary)
              print(file=summary)
              print(f"- Source: `{expected}`", file=summary)
              print(f"- Run: `{run_id}`", file=summary)
              print(f"- Attempt: `{run_attempt}`", file=summary)
          print(f"Using successful Source CI run {run_id}, attempt {run_attempt}")
          PY

  candidate:
    name: Build and verify candidate
    needs: source_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      platform_version: ${{ steps.plan.outputs.platform_version }}
      python: ${{ steps.source.outputs.python }}
      source_ci_run_attempt: ${{ needs.source_gate.outputs.run_attempt }}
      source_ci_run_id: ${{ needs.source_gate.outputs.run_id }}
      test_run_url: ${{ needs.source_gate.outputs.run_url }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the dispatch and compatibility contract
        id: source
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${EXPECTED_SOURCE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "expected_source_sha must be a full 40- or 64-character lowercase Git ID." >&2
            exit 1
          fi
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "Release candidates may only be dispatched from main." >&2
            exit 1
          fi
          if [[ "${DISPATCH_SHA}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "The selected workflow revision is not expected_source_sha." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "The checked-out commit is not expected_source_sha." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          contract = tomllib.loads(
              Path("platform/compatibility.toml").read_text(encoding="utf-8")
          )
          python_version = str(contract["runtime"]["python"])
          if not re.fullmatch(
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)",
              python_version,
          ):
              raise SystemExit("Compatibility contract has an unsafe Python version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"python={python_version}", file=output)
          PY

      - name: Verify the synchronized immutable release ledger
        id: previous
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p build
          python3 ops/release/ledger.py verify \
            --root . \
            --source-commit "${EXPECTED_SOURCE_SHA}" \
            --remote origin \
            --release-root releases/platform \
            --output build/release-ledger-unplanned.json >/dev/null

      - name: Plan changed applications and versions
        id: plan
        env:
          BOOTSTRAP: ${{ steps.previous.outputs.bootstrap }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PREVIOUS_RELEASE_PATH: ${{ steps.previous.outputs.latest_release_path }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          TEST_RUN_URL: ${{ needs.source_gate.outputs.run_url }}
        run: |
          set -Eeuo pipefail
          mkdir -p build
          command=(
            python3 ops/release/buh_release.py plan
            --root .
            --source-sha "${EXPECTED_SOURCE_SHA}"
            --test-run "${TEST_RUN_URL}"
            --output build/release-plan.json
          )
          case "${BOOTSTRAP}" in
            true)
              [[ -z "${PREVIOUS_RELEASE_PATH}" ]]
              ;;
            false)
              [[ "${PREVIOUS_RELEASE_PATH}" =~ ^releases/platform/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              command+=(--previous "${PREVIOUS_RELEASE_PATH}/RELEASE.json")
              ;;
            *)
              echo "Release-ledger bootstrap output is invalid." >&2
              exit 1
              ;;
          esac
          "${command[@]}"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          plan = json.loads(Path("build/release-plan.json").read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          if plan.get("source_commit") != expected:
              raise SystemExit("Release plan source does not match expected_source_sha")
          if plan.get("release_required") is not True:
              raise SystemExit("No release is required for this source commit")
          version = plan.get("platform_version")
          if not isinstance(version, str) or not re.fullmatch(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)",
              version,
          ):
              raise SystemExit("Planner returned an unsafe platform version")
          matrix = plan.get("build_matrix")
          if not isinstance(matrix, list):
              raise SystemExit("Planner returned an invalid build matrix")
          app_ids = [item.get("id") for item in matrix]
          if any(
              not isinstance(app_id, str)
              or not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,63}", app_id)
              for app_id in app_ids
          ):
              raise SystemExit("Planner returned an unsafe application ID")
          if len(app_ids) != len(set(app_ids)):
              raise SystemExit("Planner repeated an application build")

          artifact = (
              f"platform-release-v{version}-{expected[:12]}-"
              f"{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"platform_version={version}", file=output)
              print(f"artifact_name={artifact}", file=output)
          Path("build/apps-to-build.txt").write_text(
              "".join(f"{app_id}\n" for app_id in app_ids),
              encoding="utf-8",
          )
          print("Changed applications:", ", ".join(app_ids) if app_ids else "(none)")
          PY

      - name: Pin the planned release target to the verified ledger
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.platform_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 ops/release/ledger.py verify \
            --root . \
            --source-commit "${EXPECTED_SOURCE_SHA}" \
            --remote origin \
            --release-root releases/platform \
            --target-version "${EXPECTED_VERSION}" \
            --output build/release-state.json >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          initial = json.loads(
              Path("build/release-ledger-unplanned.json").read_text(encoding="utf-8")
          )
          pinned = json.loads(
              Path("build/release-state.json").read_text(encoding="utf-8")
          )
          target = pinned.get("target")
          expected_version = os.environ["EXPECTED_VERSION"]
          if target != {
              "platform_version": expected_version,
              "ref": f"refs/heads/release/platform-v{expected_version}",
              "release_path": f"releases/platform/v{expected_version}",
              "absent": True,
          }:
              raise SystemExit("Pinned release target is not exact and absent")
          pinned_without_target = dict(pinned)
          pinned_without_target["target"] = None
          if initial != pinned_without_target:
              raise SystemExit("Immutable release ledger changed while planning")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.source.outputs.python }}
          cache: pip
          cache-dependency-path: |
            platform/requirements/build.lock
            platform/requirements/production.lock
            platform/requirements/test.lock
            platform/requirements/production.txt
            platform/requirements/test.txt
            apps/*/pyproject.toml

      - name: Install bounded native build prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-libmysqlclient-dev \
            pkg-config

      - name: Install checksum-locked release tools
        run: |
          set -Eeuo pipefail
          python -m pip install \
            --require-hashes \
            -r platform/requirements/build.lock
          python -m pip install \
            --require-hashes \
            --no-build-isolation \
            --only-binary=:all: \
            --no-binary=celery-once,django-bootstrap-form,mysqlclient \
            -r platform/requirements/test.lock
          python ops/supply_chain.py verify

      - name: Build only changed application wheels
        run: |
          set -Eeuo pipefail
          mkdir -p build/wheels
          while IFS= read -r app_id; do
            [[ -n "${app_id}" ]] || continue
            python ops/release/buh_release.py build \
              --root . \
              --plan build/release-plan.json \
              --app "${app_id}" \
              --output-dir build/wheels
          done <build/apps-to-build.txt

      - name: Assemble with verified unchanged artifacts
        env:
          BOOTSTRAP: ${{ steps.previous.outputs.bootstrap }}
          PREVIOUS_DIR: ${{ steps.previous.outputs.latest_release_path }}
        run: |
          set -Eeuo pipefail
          command=(
            python ops/release/buh_release.py assemble
            --root .
            --plan build/release-plan.json
            --wheel-dir build/wheels
            --output-dir build/release
          )
          case "${BOOTSTRAP}" in
            true)
              [[ -z "${PREVIOUS_DIR}" ]]
              ;;
            false)
              [[ "${PREVIOUS_DIR}" =~ ^releases/platform/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              command+=(--previous-dir "${PREVIOUS_DIR}")
              ;;
            *)
              echo "Release-ledger bootstrap output is invalid." >&2
              exit 1
              ;;
          esac
          "${command[@]}"

      - name: Verify checksums, wheel metadata, and isolated installation
        run: |
          set -Eeuo pipefail
          python ops/release/buh_release.py verify --release-dir build/release
          python -m twine check build/release/*.whl
          python ops/release/buh_release.py validate-install \
            --release-dir build/release

      - name: Prove the assembled wheels in a fresh locked runtime
        env:
          EXPECTED_PYTHON: ${{ steps.source.outputs.python }}
        run: |
          set -Eeuo pipefail
          runtime_root="${RUNNER_TEMP}/buh-candidate-runtime"
          work_root="${RUNNER_TEMP}/buh-candidate-runtime-work"
          mkdir -p "${work_root}"
          python -m venv "${runtime_root}"
          runtime_python="${runtime_root}/bin/python"

          [[ "$("${runtime_python}" -c 'import platform; print(platform.python_version())')" == \
            "${EXPECTED_PYTHON}" ]]
          "${runtime_python}" -m pip install \
            --require-hashes \
            -r "${GITHUB_WORKSPACE}/platform/requirements/build.lock"
          "${runtime_python}" -m pip install \
            --require-hashes \
            --no-build-isolation \
            --only-binary=:all: \
            --no-binary=celery-once,django-bootstrap-form,mysqlclient \
            -r "${GITHUB_WORKSPACE}/platform/requirements/production.lock"

          mapfile -t release_wheels < <(
            find "${GITHUB_WORKSPACE}/build/release" \
              -maxdepth 1 -type f -name '*.whl' -print |
              LC_ALL=C sort
          )
          [[ "${#release_wheels[@]}" -gt 0 ]]
          "${runtime_python}" -m pip install \
            --no-index --no-deps "${release_wheels[@]}"
          "${runtime_python}" -m pip check

          (
            cd "${work_root}"
            env -u PYTHONPATH \
              PLAN_PATH="${GITHUB_WORKSPACE}/build/release-plan.json" \
              WORKSPACE="${GITHUB_WORKSPACE}" \
              "${runtime_python}" -P - <<'PY'
          import importlib
          import importlib.metadata
          import json
          import os
          import site
          import sys
          from pathlib import Path

          workspace = Path(os.environ["WORKSPACE"]).resolve()
          plan = json.loads(
              Path(os.environ["PLAN_PATH"]).read_text(encoding="utf-8")
          )
          source_roots = [
              (workspace / app["path"] / "src").resolve()
              for app in plan["apps"]
          ]
          site_roots = [Path(value).resolve() for value in site.getsitepackages()]

          def below(path, roots):
              return any(path == root or path.is_relative_to(root) for root in roots)

          for entry in sys.path:
              if not entry:
                  raise SystemExit("Unsafe current-directory entry in runtime sys.path")
              resolved = Path(entry).resolve()
              if below(resolved, source_roots):
                  raise SystemExit(f"Source application path leaked into sys.path: {resolved}")

          for app in plan["apps"]:
              installed_version = importlib.metadata.version(app["distribution"])
              if installed_version != app["version"]:
                  raise SystemExit(
                      f"Installed {app['distribution']} version differs from the plan"
                  )
              module = importlib.import_module(app["import_name"])
              if getattr(module, "__version__", None) != app["version"]:
                  raise SystemExit(
                      f"Imported {app['import_name']} version differs from the plan"
                  )
              module_file = getattr(module, "__file__", None)
              if not module_file:
                  raise SystemExit(f"Imported module has no file: {app['import_name']}")
              module_path = Path(module_file).resolve()
              if below(module_path, source_roots) or not below(module_path, site_roots):
                  raise SystemExit(
                      f"Imported {app['import_name']} outside the fresh runtime: {module_path}"
                  )
          PY

            django_command=(
              env -u PYTHONPATH
              "PYTHONPATH=${GITHUB_WORKSPACE}/platform/testauth"
              "PYTHONSAFEPATH=1"
              "BUH_TEST_SETTINGS=testauth.settings.unit"
              "${runtime_python}" -P
              "${GITHUB_WORKSPACE}/platform/testauth/manage.py"
            )
            "${django_command[@]}" check --no-color
            "${django_command[@]}" makemigrations \
              --check --dry-run --noinput --no-color
          )

      - name: Stage the delta candidate metadata
        run: |
          set -Eeuo pipefail
          metadata_dir="build/candidate-metadata"
          mkdir -p "${metadata_dir}"
          for name in RELEASE.json INSTALL_PLAN.json README.md SHA256SUMS; do
            source="build/release/${name}"
            [[ -f "${source}" && ! -L "${source}" ]]
            cp --no-preserve=mode,ownership,timestamps \
              "${source}" "${metadata_dir}/${name}"
            chmod 0644 "${metadata_dir}/${name}"
          done

      - name: Upload the verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: |
            build/candidate-metadata/
            build/release-plan.json
            build/release-state.json
            build/wheels/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload release-builder failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-ledger-unplanned.json
            build/release-plan.json
            build/release-state.json
            build/apps-to-build.txt
            build/candidate-metadata/
            build/wheels/
          if-no-files-found: warn
          retention-days: 7
  publication_gate:
    name: Fail-closed publication gate
    if: ${{ inputs.publish_release_branch }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require first-attempt repository-owner confirmation
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          OWNER: ${{ github.repository_owner }}
          PUBLISH_CONFIRMATION: ${{ inputs.publish_confirmation }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          [[ "${PUBLISH_CONFIRMATION}" == "PUBLISH RELEASE BRANCH" ]] || {
            echo "Publication requires the exact confirmation phrase." >&2
            exit 1
          }
          [[ "${ACTOR}" == "${OWNER}" ]] || {
            echo "Publication is restricted to the repository owner." >&2
            exit 1
          }
          [[ "${TRIGGERING_ACTOR}" == "${OWNER}" ]] || {
            echo "The triggering actor must also be the repository owner." >&2
            exit 1
          }
          [[ "${RUN_ATTEMPT}" == "1" ]] || {
            echo "Publication is forbidden on workflow reruns." >&2
            exit 1
          }
          [[ "${SELECTED_REF}" == "refs/heads/main" ]] || {
            echo "Publication may only start from main." >&2
            exit 1
          }
          [[ "${SELECTED_SHA}" == "${EXPECTED_SOURCE_SHA}" ]] || {
            echo "The dispatch source differs from expected_source_sha." >&2
            exit 1
          }

      - name: Check out the exact source for the runtime contract gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require a deployable production runtime contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          contract = tomllib.loads(
              Path("platform/compatibility.toml").read_text(encoding="utf-8")
          )
          runtime = contract.get("production_runtime")
          image = runtime.get("base_image") if isinstance(runtime, dict) else None
          pattern = re.compile(
              r"[a-z0-9]+(?:[._/-][a-z0-9]+)*"
              r"(?::[A-Za-z0-9][A-Za-z0-9._-]{0,127})?"
              r"@sha256:[0-9a-f]{64}"
          )
          if not isinstance(image, str) or not pattern.fullmatch(image):
              raise SystemExit(
                  "Publication is blocked until production_runtime.base_image "
                  "contains the reviewed production image digest"
              )
          PY

  prepare_publication:
    name: Prepare publication payload
    if: ${{ inputs.publish_release_branch }}
    needs: [candidate, publication_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Check out the exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download this run's verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: build

      - name: Reverify the candidate's pinned release ledger
        id: ledger
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ -f build/release-state.json && ! -L build/release-state.json ]]
          python3 ops/release/ledger.py verify \
            --root . \
            --source-commit "${EXPECTED_SOURCE_SHA}" \
            --remote origin \
            --release-root releases/platform \
            --target-version "${EXPECTED_VERSION}" \
            --output build/publish-release-state.json >/dev/null
          cmp --silent \
            build/release-state.json build/publish-release-state.json

      - name: Reconstruct and verify the delta candidate
        env:
          BOOTSTRAP: ${{ steps.ledger.outputs.bootstrap }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          PREVIOUS_RELEASE_PATH: ${{ steps.ledger.outputs.latest_release_path }}
          TEST_RUN_URL: ${{ needs.candidate.outputs.test_run_url }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]]
          [[ -f build/release-plan.json && ! -L build/release-plan.json ]]
          [[ ! -e build/release && ! -L build/release ]]
          mkdir -p build/wheels

          previous_dir=""
          previous_manifest=""
          case "${BOOTSTRAP}" in
            true)
              [[ -z "${PREVIOUS_RELEASE_PATH}" ]]
              ;;
            false)
              [[ "${PREVIOUS_RELEASE_PATH}" =~ ^releases/platform/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              previous_dir="${PREVIOUS_RELEASE_PATH}"
              previous_manifest="${PREVIOUS_RELEASE_PATH}/RELEASE.json"
              [[ -f "${previous_manifest}" && ! -L "${previous_manifest}" ]]
              ;;
            *)
              echo "Release-ledger bootstrap output is invalid." >&2
              exit 1
              ;;
          esac
          export PREVIOUS_DIR="${previous_dir}"

          command=(
            python ops/release/buh_release.py plan
            --root .
            --source-sha "${EXPECTED_SOURCE_SHA}"
            --test-run "${TEST_RUN_URL}"
            --output build/publish-plan.json
          )
          if [[ -n "${previous_manifest}" ]]; then
            command+=(--previous "${previous_manifest}")
          fi
          "${command[@]}"

          assemble=(
            python ops/release/buh_release.py assemble
            --root .
            --plan build/publish-plan.json
            --wheel-dir build/wheels
            --output-dir build/release
          )
          if [[ -n "${previous_dir}" ]]; then
            assemble+=(--previous-dir "${previous_dir}")
          fi
          "${assemble[@]}"
          python ops/release/buh_release.py verify --release-dir build/release
          python ops/release/buh_release.py validate-install \
            --release-dir build/release

          mapfile -t candidate_metadata < <(
            find build/candidate-metadata -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )
          expected_metadata=(INSTALL_PLAN.json README.md RELEASE.json SHA256SUMS)
          [[ "${#candidate_metadata[@]}" -eq "${#expected_metadata[@]}" ]]
          for index in "${!expected_metadata[@]}"; do
            name="${expected_metadata[index]}"
            [[ "${candidate_metadata[index]}" == "${name}" ]]
            [[ -f "build/candidate-metadata/${name}" ]]
            [[ ! -L "build/candidate-metadata/${name}" ]]
            cmp --silent \
              "build/candidate-metadata/${name}" "build/release/${name}"
          done

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          candidate = json.loads(
              Path("build/release-plan.json").read_text(encoding="utf-8")
          )
          recomputed = json.loads(
              Path("build/publish-plan.json").read_text(encoding="utf-8")
          )
          for plan in (candidate, recomputed):
              previous = plan.get("previous_manifest")
              if previous is not None:
                  previous.pop("path", None)
          if candidate != recomputed:
              raise SystemExit("Downloaded and recomputed release plans differ")

          manifest = json.loads(
              Path("build/release/RELEASE.json").read_text(encoding="utf-8")
          )
          if manifest.get("source_commit") != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("Candidate manifest is for another source commit")
          if manifest.get("platform_version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Candidate manifest has an unexpected platform version")
          if recomputed.get("platform_version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Recomputed plan has an unexpected platform version")
          if manifest.get("platform_id") != recomputed["platform_id"]:
              raise SystemExit("Candidate and plan have different platform identities")

          expected_build = {
              **recomputed["build"],
              "test_run": recomputed.get("test_run"),
          }
          if manifest.get("build") != expected_build:
              raise SystemExit("Candidate build provenance differs from the plan")
          if manifest.get("changes") != recomputed["changes"]:
              raise SystemExit("Candidate change history differs from the plan")
          if manifest.get("compatibility") != {
              "sha256": recomputed["build"]["compatibility_sha256"],
              "values": recomputed["compatibility"],
          }:
              raise SystemExit("Candidate compatibility contract differs from the plan")

          previous = recomputed.get("previous_manifest")
          deployment_predecessor = recomputed.get("deployment_predecessor")
          expected_previous = None
          if deployment_predecessor is not None:
              expected_previous = {
                  key: deployment_predecessor[key]
                  for key in (
                      "platform_version",
                      "source_commit",
                      "manifest_sha256",
                  )
              }
          elif previous is not None:
              expected_previous = {
                  "platform_version": recomputed["previous_platform_version"],
                  "source_commit": previous["source_commit"],
                  "manifest_sha256": previous["sha256"],
              }
          if manifest.get("previous_release") != expected_previous:
              raise SystemExit("Candidate previous-release identity differs from the plan")

          artifacts = {item["component"]: item for item in manifest["artifacts"]}
          expected_components = {
              *(app["id"] for app in recomputed["apps"]),
              *(item["component"] for item in recomputed["dependency_artifacts"]),
          }
          if set(artifacts) != expected_components:
              raise SystemExit("Candidate artifact components differ from the plan")
          for app in recomputed["apps"]:
              artifact = artifacts[app["id"]]
              expected = {
                  "kind": "owned",
                  "distribution": app["distribution"],
                  "version": app["version"],
                  "input_sha256": app["input_sha256"],
                  "import_name": app["import_name"],
                  "origin": "built" if app["build"] else "reused",
              }
              for key, value in expected.items():
                  if artifact.get(key) != value:
                      raise SystemExit(
                          f"Candidate artifact {app['id']} has unexpected {key}"
                      )
          for dependency in recomputed["dependency_artifacts"]:
              artifact = artifacts[dependency["component"]]
              expected = {
                  "kind": "third-party",
                  "distribution": dependency["distribution"],
                  "version": dependency["version"],
                  "filename": dependency["filename"],
                  "sha256": dependency["sha256"],
                  "origin": "reused" if dependency["action"] == "reuse" else "provided",
              }
              for key, value in expected.items():
                  if artifact.get(key) != value:
                      raise SystemExit(
                          f"Candidate dependency {dependency['component']} has unexpected {key}"
                      )

          wheel_name = re.compile(
              r"[A-Za-z0-9][A-Za-z0-9._+-]{0,254}\.whl"
          )
          expected_built = {
              artifacts[app["id"]]["filename"]
              for app in recomputed["apps"]
              if app["build"]
          }
          actual_built = set()
          for wheel in Path("build/wheels").iterdir():
              if (
                  not wheel.is_file()
                  or wheel.is_symlink()
                  or not wheel_name.fullmatch(wheel.name)
              ):
                  raise SystemExit(f"Unsafe delta wheel entry: {wheel}")
              actual_built.add(wheel.name)
          if actual_built != expected_built:
              raise SystemExit(
                  "Delta transport does not contain exactly the newly built wheels"
              )

          previous_dir = Path(os.environ["PREVIOUS_DIR"]) if os.environ["PREVIOUS_DIR"] else None
          prior_artifacts = {}
          if previous_dir is not None:
              prior_manifest = json.loads(
                  (previous_dir / "RELEASE.json").read_text(encoding="utf-8")
              )
              prior_artifacts = {
                  item["component"]: item for item in prior_manifest["artifacts"]
              }

          release_path = (
              Path(recomputed["release_root"])
              / f"v{recomputed['platform_version']}"
          ).as_posix()
          reusable = []

          def record_existing_blob(component, artifact, source_path, origin):
              source = Path(source_path)
              if (
                  source.is_absolute()
                  or not source.is_file()
                  or source.is_symlink()
                  or source.as_posix().startswith("../")
              ):
                  raise SystemExit(f"Unsafe existing artifact source: {source}")
              raw = subprocess.run(
                  [
                      "git",
                      "ls-tree",
                      "-z",
                      os.environ["EXPECTED_SOURCE_SHA"],
                      "--",
                      source.as_posix(),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              if not raw.endswith(b"\0") or raw.count(b"\0") != 1:
                  raise SystemExit(f"Artifact is not one exact Git blob: {source}")
              header, tracked_path = raw[:-1].split(b"\t", 1)
              mode, kind, blob_sha = header.decode("ascii").split()
              if (
                  mode != "100644"
                  or kind != "blob"
                  or tracked_path.decode("utf-8") != source.as_posix()
                  or not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", blob_sha)
              ):
                  raise SystemExit(f"Artifact has an unsafe Git identity: {source}")
              hashed_blob = subprocess.run(
                  ["git", "hash-object", "--no-filters", "--", source.as_posix()],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              ).stdout.strip()
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              if hashed_blob != blob_sha or digest != artifact["sha256"]:
                  raise SystemExit(f"Artifact bytes differ from their identities: {source}")
              target = f"{release_path}/{artifact['filename']}"
              reusable.append(
                  {
                      "blob_sha": blob_sha,
                      "component": component,
                      "filename": artifact["filename"],
                      "origin": origin,
                      "sha256": digest,
                      "source_path": source.as_posix(),
                      "target_path": target,
                  }
              )

          for app in recomputed["apps"]:
              if app["build"]:
                  continue
              if previous_dir is None:
                  raise SystemExit(f"Reused app has no previous release: {app['id']}")
              artifact = artifacts[app["id"]]
              prior = prior_artifacts.get(app["id"])
              if prior is None or any(
                  prior.get(key) != artifact.get(key)
                  for key in ("distribution", "version", "filename", "sha256")
              ):
                  raise SystemExit(f"Reused app identity changed: {app['id']}")
              record_existing_blob(
                  app["id"], artifact, previous_dir / artifact["filename"], "reused"
              )

          for dependency in recomputed["dependency_artifacts"]:
              component = dependency["component"]
              artifact = artifacts[component]
              if dependency["action"] == "reuse":
                  if previous_dir is None:
                      raise SystemExit(
                          f"Reused dependency has no previous release: {component}"
                      )
                  prior = prior_artifacts.get(component)
                  if prior is None or any(
                      prior.get(key) != artifact.get(key)
                      for key in ("distribution", "version", "filename", "sha256")
                  ):
                      raise SystemExit(
                          f"Reused dependency identity changed: {component}"
                      )
                  source = previous_dir / artifact["filename"]
                  origin = "reused"
              elif dependency["action"] == "provide":
                  source = Path(dependency["source"])
                  origin = "provided"
              else:
                  raise SystemExit(f"Unsafe dependency action: {component}")
              record_existing_blob(component, artifact, source, origin)
              expected_blob = dependency.get("git_blob_sha")
              if expected_blob and reusable[-1]["blob_sha"] != expected_blob:
                  raise SystemExit(f"Dependency Git blob changed: {component}")

          targets = [item["target_path"] for item in reusable]
          if len(targets) != len(set(targets)):
              raise SystemExit("Existing Git blob targets collide")
          Path("build/reused-git-blobs.json").write_text(
              json.dumps(
                  sorted(reusable, key=lambda item: item["component"]),
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Construct and validate the append-only release tree
        env:
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          from ops.release.buh_release import (
              VERSION_ASSIGNMENT_RE,
              _replace_version,
              load_plan,
              validate_append_only_changes,
              version_updates,
          )

          plan = load_plan(Path("build/publish-plan.json"))
          release_path = Path(plan["release_root"]) / f"v{plan['platform_version']}"
          if release_path.exists() or release_path.is_symlink():
              raise SystemExit(f"Release path already exists: {release_path}")
          release_path.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree("build/release", release_path)

          version_paths = set()
          for update in version_updates(plan):
              path = Path(update["path"])
              content = path.read_bytes()
              matches = list(VERSION_ASSIGNMENT_RE.finditer(content))
              current = (
                  content[matches[0].end("prefix") : matches[0].start("suffix")]
                  if len(matches) == 1
                  else b""
              )
              if current != update["from"].encode("ascii"):
                  raise SystemExit(f"Version source changed unexpectedly: {path}")
              _replace_version(path, update["to"])
              version_paths.add(path.as_posix())

          fragment_paths = set()
          for fragment in plan["consumed_fragments"]:
              path = Path("changes") / fragment
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Change fragment is missing or unsafe: {path}")
              path.unlink()
              fragment_paths.add(path.as_posix())

          subprocess.run(
              [
                  "git",
                  "add",
                  "-A",
                  "--",
                  release_path.as_posix(),
                  *sorted(version_paths),
                  *sorted(fragment_paths),
              ],
              check=True,
          )
          raw = subprocess.run(
              ["git", "diff", "--cached", "--name-status", "-z", "--no-renames"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          fields = raw.split(b"\0")
          if fields and fields[-1] == b"":
              fields.pop()
          if len(fields) % 2:
              raise SystemExit("Unexpected staged name-status encoding")

          changes = []
          release_prefix = release_path.as_posix() + "/"
          for index in range(0, len(fields), 2):
              status = fields[index].decode("ascii")
              path = fields[index + 1].decode("utf-8")
              if status == "A" and path.startswith(release_prefix):
                  pass
              elif status == "M" and path in version_paths:
                  pass
              elif status == "D" and path in fragment_paths:
                  pass
              else:
                  raise SystemExit(f"Unexpected release-tree change: {status} {path}")
              changes.append((status, path))

          if not changes:
              raise SystemExit("Release tree would be empty")
          if {path for status, path in changes if status == "M"} != version_paths:
              raise SystemExit("Release tree has incomplete version updates")
          if {path for status, path in changes if status == "D"} != fragment_paths:
              raise SystemExit("Release tree has incomplete fragment consumption")
          validate_append_only_changes(
              changes,
              new_release_path=release_path.as_posix(),
          )
          PY

      - name: Create deterministic commit, binary patch, and strict metadata
        id: package
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.candidate.outputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.candidate.outputs.source_ci_run_id }}
          SOURCE_CI_URL: ${{ needs.candidate.outputs.test_run_url }}
        run: |
          set -Eeuo pipefail
          publication_dir="build/publication"
          mkdir -p "${publication_dir}"
          [[ -f build/release-state.json && ! -L build/release-state.json ]]
          cp --no-preserve=mode,ownership,timestamps \
            build/release-state.json "${publication_dir}/release-state.json"
          chmod 0644 "${publication_dir}/release-state.json"

          source_epoch="$(git show -s --format=%ct "${EXPECTED_SOURCE_SHA}")"
          [[ "${source_epoch}" =~ ^[0-9]+$ ]]
          tree_sha="$(git write-tree)"
          message="release: platform v${EXPECTED_VERSION}"
          release_commit="$(
            printf '%s\n' "${message}" |
              env \
                GIT_AUTHOR_NAME="github-actions[bot]" \
                GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
                GIT_AUTHOR_DATE="${source_epoch} +0000" \
                GIT_COMMITTER_NAME="github-actions[bot]" \
                GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
                GIT_COMMITTER_DATE="${source_epoch} +0000" \
                git commit-tree "${tree_sha}" -p "${EXPECTED_SOURCE_SHA}"
          )"
          [[ "$(git rev-list --parents -n 1 "${release_commit}")" == \
            "${release_commit} ${EXPECTED_SOURCE_SHA}" ]]

          export RELEASE_COMMIT="${release_commit}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          publication_dir = Path("build/publication")
          reused = json.loads(
              Path("build/reused-git-blobs.json").read_text(encoding="utf-8")
          )
          base = [
              "git",
              "diff",
              "--binary",
              "--full-index",
              "--no-color",
              "--no-ext-diff",
              "--no-textconv",
          ]
          source = os.environ["EXPECTED_SOURCE_SHA"]
          release = os.environ["RELEASE_COMMIT"]
          normal = subprocess.run(
              [
                  *base,
                  "--no-renames",
                  source,
                  release,
                  "--",
                  ".",
                  *(f":(exclude,top){item['target_path']}" for item in reused),
              ],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          chunks = [normal]
          for item in sorted(reused, key=lambda value: value["target_path"]):
              source_path = item["source_path"]
              target_path = item["target_path"]
              copy_patch = subprocess.run(
                  [
                      *base,
                      "--find-copies-harder",
                      "--find-copies=100%",
                      source,
                      release,
                      "--",
                      source_path,
                      target_path,
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              expected = (
                  f"diff --git a/{source_path} b/{target_path}\n"
                  "similarity index 100%\n"
                  f"copy from {source_path}\n"
                  f"copy to {target_path}\n"
              ).encode("utf-8")
              if copy_patch != expected:
                  raise SystemExit(
                      f"Git did not encode exact blob reuse for {target_path}"
                  )
              chunks.append(copy_patch)
          patch = b"".join(chunks)
          if not patch:
              raise SystemExit("Publication patch is empty")
          (publication_dir / "release.patch").write_bytes(patch)
          PY
          [[ -s "${publication_dir}/release.patch" ]]

          verification_index="${RUNNER_TEMP}/prepared-publication.index"
          GIT_INDEX_FILE="${verification_index}" git read-tree \
            "${EXPECTED_SOURCE_SHA}^{tree}"
          GIT_INDEX_FILE="${verification_index}" git apply \
            --check --cached --binary "${publication_dir}/release.patch"
          GIT_INDEX_FILE="${verification_index}" git apply \
            --cached --binary "${publication_dir}/release.patch"
          [[ "$(GIT_INDEX_FILE="${verification_index}" git write-tree)" == \
            "${tree_sha}" ]]

          export SOURCE_EPOCH="${source_epoch}"
          export TREE_SHA="${tree_sha}"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          publication_dir = Path("build/publication")
          raw = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-status",
                  "-z",
                  "--no-renames",
                  os.environ["EXPECTED_SOURCE_SHA"],
                  os.environ["RELEASE_COMMIT"],
                  "--",
              ],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          fields = raw.split(b"\0")
          if fields and fields[-1] == b"":
              fields.pop()
          if len(fields) % 2:
              raise SystemExit("Unexpected release diff encoding")
          changes = [
              {
                  "status": fields[index].decode("ascii"),
                  "path": fields[index + 1].decode("utf-8"),
              }
              for index in range(0, len(fields), 2)
          ]
          patch = publication_dir / "release.patch"
          metadata = {
              "branch": f"release/platform-v{os.environ['EXPECTED_VERSION']}",
              "changes": changes,
              "patch_sha256": hashlib.sha256(patch.read_bytes()).hexdigest(),
              "platform_version": os.environ["EXPECTED_VERSION"],
              "release_commit": os.environ["RELEASE_COMMIT"],
              "release_path": f"releases/platform/v{os.environ['EXPECTED_VERSION']}",
              "reused_git_blobs": json.loads(
                  Path("build/reused-git-blobs.json").read_text(encoding="utf-8")
              ),
              "schema_version": 1,
              "source_ci_run_attempt": int(os.environ["SOURCE_CI_RUN_ATTEMPT"]),
              "source_ci_run_id": int(os.environ["SOURCE_CI_RUN_ID"]),
              "source_ci_url": os.environ["SOURCE_CI_URL"],
              "source_epoch": int(os.environ["SOURCE_EPOCH"]),
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "tree_sha": os.environ["TREE_SHA"],
          }
          (publication_dir / "metadata.json").write_text(
              json.dumps(
                  metadata,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd "${publication_dir}"
            sha256sum metadata.json release-state.json release.patch >SHA256SUMS
          )
          artifact_name="platform-publication-v${EXPECTED_VERSION}-${RUN_ID}-${RUN_ATTEMPT}"
          echo "artifact_name=${artifact_name}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Publication payload prepared"
            echo
            echo "- Source CI run: ${SOURCE_CI_RUN_ID}"
            echo "- Source CI attempt: ${SOURCE_CI_RUN_ATTEMPT}"
            echo "- Release commit: ${release_commit}"
            echo "- Payload: ${artifact_name}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload immutable publication payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: build/publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish preverified release branch
    if: ${{ inputs.publish_release_branch }}
    needs: [candidate, publication_gate, prepare_publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: platform-release-publication
    permissions:
      contents: write
    outputs:
      release_branch: ${{ steps.publish_refs.outputs.release_branch }}
      release_commit: ${{ steps.publish_refs.outputs.release_commit }}
      sync_branch: ${{ steps.publish_refs.outputs.sync_branch }}
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download preverified publication payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare_publication.outputs.artifact_name }}
          path: ${{ runner.temp }}/platform-publication

      - name: Reverify the pinned release ledger before publication
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_DIR: ${{ runner.temp }}/platform-publication
        run: |
          set -Eeuo pipefail
          [[ -f "${PUBLICATION_DIR}/release-state.json" ]]
          [[ ! -L "${PUBLICATION_DIR}/release-state.json" ]]
          python3 ops/release/ledger.py verify \
            --root . \
            --source-commit "${EXPECTED_SOURCE_SHA}" \
            --remote origin \
            --release-root releases/platform \
            --target-version "${EXPECTED_VERSION}" \
            --output "${RUNNER_TEMP}/publish-release-state.json" >/dev/null
          cmp --silent \
            "${PUBLICATION_DIR}/release-state.json" \
            "${RUNNER_TEMP}/publish-release-state.json"

      - name: Validate payload and reconstruct the exact release commit
        id: verify
        env:
          EXPECTED_SOURCE_CI_ATTEMPT: ${{ needs.candidate.outputs.source_ci_run_attempt }}
          EXPECTED_SOURCE_CI_RUN_ID: ${{ needs.candidate.outputs.source_ci_run_id }}
          EXPECTED_SOURCE_CI_URL: ${{ needs.candidate.outputs.test_run_url }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          PUBLICATION_DIR: ${{ runner.temp }}/platform-publication
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "${RUN_ATTEMPT}" == "1" ]] || {
            echo "Publication is forbidden on workflow reruns." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]]
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "${EXPECTED_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${EXPECTED_SOURCE_CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_SOURCE_CI_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]

          mapfile -t payload_files < <(
            find "${PUBLICATION_DIR}" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_files=(SHA256SUMS metadata.json release-state.json release.patch)
          [[ "${#payload_files[@]}" -eq "${#expected_files[@]}" ]]
          for index in "${!expected_files[@]}"; do
            [[ "${payload_files[index]}" == "${expected_files[index]}" ]]
            [[ -f "${PUBLICATION_DIR}/${payload_files[index]}" ]]
            [[ ! -L "${PUBLICATION_DIR}/${payload_files[index]}" ]]
          done

          declare -A checksum_names=()
          checksum_count=0
          while IFS= read -r line; do
            [[ "${line}" =~ ^([0-9a-f]{64})\ \ (metadata\.json|release-state\.json|release\.patch)$ ]]
            checksum_names["${BASH_REMATCH[2]}"]=1
            checksum_count=$((checksum_count + 1))
          done <"${PUBLICATION_DIR}/SHA256SUMS"
          [[ "${checksum_count}" -eq 3 ]]
          [[ "${#checksum_names[@]}" -eq 3 ]]
          (
            cd "${PUBLICATION_DIR}"
            sha256sum --check --strict SHA256SUMS
          )

          canonical_metadata="${RUNNER_TEMP}/platform-publication-canonical.json"
          jq -cS . "${PUBLICATION_DIR}/metadata.json" >"${canonical_metadata}"
          cmp --silent "${canonical_metadata}" "${PUBLICATION_DIR}/metadata.json"

          jq -e '
            type == "object"
            and (keys == [
              "branch",
              "changes",
              "patch_sha256",
              "platform_version",
              "release_commit",
              "release_path",
              "reused_git_blobs",
              "schema_version",
              "source_ci_run_attempt",
              "source_ci_run_id",
              "source_ci_url",
              "source_epoch",
              "source_sha",
              "tree_sha"
            ])
            and .schema_version == 1
            and (.branch | type == "string")
            and (.platform_version | type == "string")
            and (.release_commit | type == "string")
            and (.release_path | type == "string")
            and (.patch_sha256 | type == "string")
            and (.source_sha | type == "string")
            and (.source_epoch | type == "number" and floor == . and . >= 0)
            and (.source_ci_run_id | type == "number" and floor == . and . >= 1)
            and (.source_ci_run_attempt | type == "number" and floor == . and . >= 1)
            and (.source_ci_url | type == "string")
            and (.tree_sha | type == "string")
            and (.changes | type == "array" and length > 0)
            and (.reused_git_blobs | type == "array")
            and all(
              .changes[];
              type == "object"
              and (keys == ["path", "status"])
              and (.path | type == "string")
              and (.status | type == "string")
            )
            and all(
              .reused_git_blobs[];
              type == "object"
              and (keys == [
                "blob_sha",
                "component",
                "filename",
                "origin",
                "sha256",
                "source_path",
                "target_path"
              ])
              and (.blob_sha | type == "string")
              and (.component | type == "string")
              and (.filename | type == "string")
              and (.origin | type == "string")
              and (.sha256 | type == "string")
              and (.source_path | type == "string")
              and (.target_path | type == "string")
            )
          ' "${PUBLICATION_DIR}/metadata.json" >/dev/null

          source_sha="$(jq -r '.source_sha' "${PUBLICATION_DIR}/metadata.json")"
          version="$(jq -r '.platform_version' "${PUBLICATION_DIR}/metadata.json")"
          branch="$(jq -r '.branch' "${PUBLICATION_DIR}/metadata.json")"
          release_path="$(jq -r '.release_path' "${PUBLICATION_DIR}/metadata.json")"
          metadata_patch_sha="$(jq -r '.patch_sha256' "${PUBLICATION_DIR}/metadata.json")"
          metadata_commit="$(jq -r '.release_commit' "${PUBLICATION_DIR}/metadata.json")"
          metadata_tree="$(jq -r '.tree_sha' "${PUBLICATION_DIR}/metadata.json")"
          metadata_epoch="$(jq -r '.source_epoch' "${PUBLICATION_DIR}/metadata.json")"
          metadata_ci_id="$(jq -r '.source_ci_run_id' "${PUBLICATION_DIR}/metadata.json")"
          metadata_ci_attempt="$(jq -r '.source_ci_run_attempt' "${PUBLICATION_DIR}/metadata.json")"
          metadata_ci_url="$(jq -r '.source_ci_url' "${PUBLICATION_DIR}/metadata.json")"

          [[ "${source_sha}" == "${EXPECTED_SOURCE_SHA}" ]]
          [[ "${version}" == "${EXPECTED_VERSION}" ]]
          [[ "${branch}" == "release/platform-v${EXPECTED_VERSION}" ]]
          [[ "${release_path}" == "releases/platform/v${EXPECTED_VERSION}" ]]
          [[ "${metadata_ci_id}" == "${EXPECTED_SOURCE_CI_RUN_ID}" ]]
          [[ "${metadata_ci_attempt}" == "${EXPECTED_SOURCE_CI_ATTEMPT}" ]]
          [[ "${metadata_ci_url}" == "${EXPECTED_SOURCE_CI_URL}" ]]
          [[ "${metadata_patch_sha}" == \
            "$(sha256sum "${PUBLICATION_DIR}/release.patch" | awk '{print $1}')" ]]
          [[ "${metadata_commit}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "${metadata_tree}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "${metadata_epoch}" =~ ^[0-9]+$ ]]

          source_epoch="$(git show -s --format=%ct "${EXPECTED_SOURCE_SHA}")"
          [[ "${metadata_epoch}" == "${source_epoch}" ]]

          declare -A reused_components=()
          declare -A reused_targets=()
          reused_count=0
          reused_tsv="${RUNNER_TEMP}/platform-publication-reused.tsv"
          jq -r '
            .reused_git_blobs[] |
            [
              .blob_sha,
              .component,
              .filename,
              .origin,
              .sha256,
              .source_path,
              .target_path
            ] | @tsv
          ' "${PUBLICATION_DIR}/metadata.json" >"${reused_tsv}"
          while IFS=$'\t' read -r \
            blob_sha component filename origin artifact_sha source_path target_path trailing; do
            [[ -n "${blob_sha}" ]]
            [[ -z "${trailing:-}" ]]
            [[ "${blob_sha}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
            [[ "${component}" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
            [[ "${filename}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,254}\.whl$ ]]
            [[ "${origin}" == "reused" || "${origin}" == "provided" ]]
            [[ "${artifact_sha}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${source_path}" =~ ^releases/([A-Za-z0-9][A-Za-z0-9._+-]{0,63}/)*v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/[A-Za-z0-9][A-Za-z0-9._+-]{0,254}\.whl$ ]]
            [[ "${source_path##*/}" == "${filename}" ]]
            [[ "${target_path}" == "${release_path}/${filename}" ]]
            [[ "${source_path}" != "${target_path}" ]]
            [[ -z "${reused_components[${component}]+present}" ]]
            [[ -z "${reused_targets[${target_path}]+present}" ]]
            [[ -f "${source_path}" && ! -L "${source_path}" ]]

            source_entry="$(git ls-tree "${EXPECTED_SOURCE_SHA}" -- "${source_path}")"
            [[ "${source_entry}" == *$'\t'"${source_path}" ]]
            source_header="${source_entry%%$'\t'*}"
            read -r source_mode source_type source_blob source_trailing \
              <<<"${source_header}"
            [[ "${source_mode}" == "100644" ]]
            [[ "${source_type}" == "blob" ]]
            [[ "${source_blob}" == "${blob_sha}" ]]
            [[ -z "${source_trailing:-}" ]]
            [[ "$(git hash-object --no-filters -- "${source_path}")" == \
              "${blob_sha}" ]]
            [[ "$(sha256sum "${source_path}" | awk '{print $1}')" == \
              "${artifact_sha}" ]]
            [[ "$(grep -Fxc -- "copy from ${source_path}" \
              "${PUBLICATION_DIR}/release.patch" || true)" -eq 1 ]]
            [[ "$(grep -Fxc -- "copy to ${target_path}" \
              "${PUBLICATION_DIR}/release.patch" || true)" -eq 1 ]]

            reused_components["${component}"]="${filename}:${artifact_sha}:${origin}"
            reused_targets["${target_path}"]="${blob_sha}"
            reused_count=$((reused_count + 1))
          done <"${reused_tsv}"
          [[ "${reused_count}" -eq \
            "$(jq '.reused_git_blobs | length' "${PUBLICATION_DIR}/metadata.json")" ]]

          temporary_index="${RUNNER_TEMP}/platform-publication.index"
          cp .git/index "${temporary_index}"
          GIT_INDEX_FILE="${temporary_index}" git apply \
            --check --cached --binary "${PUBLICATION_DIR}/release.patch"
          GIT_INDEX_FILE="${temporary_index}" git apply \
            --cached --binary "${PUBLICATION_DIR}/release.patch"

          actual_changes="${RUNNER_TEMP}/platform-publication-actual.tsv"
          : >"${actual_changes}"
          additions=0
          change_count=0
          require_regular_index_blob() {
            local entry entry_path mode object_id stage trailing
            entry="$(
              GIT_INDEX_FILE="${temporary_index}" git ls-files --stage -- "$1"
            )"
            [[ "${entry}" == *$'\t'* ]]
            entry_path="${entry#*$'\t'}"
            entry="${entry%%$'\t'*}"
            read -r mode object_id stage trailing <<<"${entry}"
            [[ "${entry_path}" == "$1" ]]
            [[ "${mode}" == "100644" ]]
            [[ "${object_id}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
            [[ "${stage}" == "0" ]]
            [[ -z "${trailing:-}" ]]
          }
          require_regular_source_blob() {
            local entry entry_path mode object_id object_type trailing
            entry="$(git ls-tree "${EXPECTED_SOURCE_SHA}" -- "$1")"
            [[ "${entry}" == *$'\t'* ]]
            entry_path="${entry#*$'\t'}"
            entry="${entry%%$'\t'*}"
            read -r mode object_type object_id trailing <<<"${entry}"
            [[ "${entry_path}" == "$1" ]]
            [[ "${mode}" == "100644" ]]
            [[ "${object_type}" == "blob" ]]
            [[ "${object_id}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
            [[ -z "${trailing:-}" ]]
          }
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            case "${status}" in
              A)
                [[ "${path}" == "${release_path}/"* ]]
                release_filename="${path#${release_path}/}"
                [[ "${release_filename}" != */* ]]
                [[ "${release_filename}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,254}$ ]]
                require_regular_index_blob "${path}"
                additions=$((additions + 1))
                ;;
              M)
                [[ "${path}" =~ ^apps/[a-z0-9][a-z0-9-]{0,63}/src/[A-Za-z_][A-Za-z0-9_]*/__init__\.py$ ]]
                require_regular_source_blob "${path}"
                require_regular_index_blob "${path}"
                ;;
              D)
                [[ "${path}" =~ ^changes/[A-Za-z0-9][A-Za-z0-9._+-]{0,254}\.toml$ ]]
                require_regular_source_blob "${path}"
                ;;
              *)
                echo "Forbidden patch status: ${status} ${path}" >&2
                exit 1
                ;;
            esac
            printf '%s\t%s\n' "${status}" "${path}" >>"${actual_changes}"
            change_count=$((change_count + 1))
          done < <(
            GIT_INDEX_FILE="${temporary_index}" git diff \
              --cached --name-status -z --no-renames
          )
          [[ "${change_count}" -gt 0 ]]
          [[ "${additions}" -gt 0 ]]

          metadata_changes="${RUNNER_TEMP}/platform-publication-metadata.tsv"
          jq -r '.changes[] | [.status, .path] | @tsv' \
            "${PUBLICATION_DIR}/metadata.json" >"${metadata_changes}"
          LC_ALL=C sort "${actual_changes}" >"${actual_changes}.sorted"
          LC_ALL=C sort "${metadata_changes}" >"${metadata_changes}.sorted"
          cmp --silent "${actual_changes}.sorted" "${metadata_changes}.sorted"

          for target_path in "${!reused_targets[@]}"; do
            [[ "$(awk -F '\t' -v target="${target_path}" \
              '$1 == "A" && $2 == target { count += 1 } END { print count + 0 }' \
              "${actual_changes}")" -eq 1 ]]
            target_entry="$(
              GIT_INDEX_FILE="${temporary_index}" git ls-files \
                --stage -- "${target_path}"
            )"
            target_header="${target_entry%%$'\t'*}"
            read -r target_mode target_blob target_stage target_trailing \
              <<<"${target_header}"
            [[ "${target_mode}" == "100644" ]]
            [[ "${target_blob}" == "${reused_targets[${target_path}]}" ]]
            [[ "${target_stage}" == "0" ]]
            [[ -z "${target_trailing:-}" ]]
          done

          tree_sha="$(GIT_INDEX_FILE="${temporary_index}" git write-tree)"
          [[ "${tree_sha}" == "${metadata_tree}" ]]
          for required in RELEASE.json INSTALL_PLAN.json README.md SHA256SUMS; do
            [[ "$(git cat-file -t "${tree_sha}:${release_path}/${required}")" == "blob" ]]
          done

          release_manifest="${RUNNER_TEMP}/platform-publication-release.json"
          git cat-file blob "${tree_sha}:${release_path}/RELEASE.json" \
            >"${release_manifest}"
          jq -e \
            --arg branch "${branch}" \
            --arg release_path "${release_path}" \
            --arg source "${EXPECTED_SOURCE_SHA}" \
            --arg version "${EXPECTED_VERSION}" \
            --slurpfile ledger "${PUBLICATION_DIR}/release-state.json" \
            --slurpfile plan build/publish-plan.json '
              $ledger[0] as $state
              | $plan[0] as $candidate
              | type == "object"
              and .source_commit == $source
              and .platform_version == $version
              and .platform_id == $state.platform_id
              and $state.source_commit == $source
              and $state.target == {
                absent: true,
                platform_version: $version,
                ref: ("refs/heads/" + $branch),
                release_path: $release_path
              }
              and .previous_release == (
                if $state.bootstrap then
                  null
                elif $candidate.deployment_predecessor != null then
                  {
                    manifest_sha256:
                      $candidate.deployment_predecessor.manifest_sha256,
                    platform_version:
                      $candidate.deployment_predecessor.platform_version,
                    source_commit:
                      $candidate.deployment_predecessor.source_commit
                  }
                else
                  {
                    manifest_sha256: $state.latest.manifest_sha256,
                    platform_version: $state.latest.platform_version,
                    source_commit: $state.latest.source_commit
                  }
                end
              )
              and (.artifacts | type == "array" and length > 0)
            ' "${release_manifest}" >/dev/null

          expected_release_files="${RUNNER_TEMP}/platform-release-files.expected"
          actual_release_files="${RUNNER_TEMP}/platform-release-files.actual"
          manifest_reused="${RUNNER_TEMP}/platform-manifest-reused.tsv"
          : >"${expected_release_files}"
          : >"${manifest_reused}"
          printf '%s\n' INSTALL_PLAN.json README.md RELEASE.json SHA256SUMS \
            >>"${expected_release_files}"
          declare -A manifest_components=()
          declare -A manifest_filenames=()
          artifact_count=0
          while IFS=$'\t' read -r \
            component filename origin artifact_sha trailing; do
            [[ -n "${component}" && -z "${trailing:-}" ]]
            [[ "${component}" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
            [[ "${filename}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,254}\.whl$ ]]
            [[ "${origin}" == "built" || "${origin}" == "reused" || \
              "${origin}" == "provided" ]]
            [[ "${artifact_sha}" =~ ^[0-9a-f]{64}$ ]]
            [[ -z "${manifest_components[${component}]+present}" ]]
            [[ -z "${manifest_filenames[${filename}]+present}" ]]
            manifest_components["${component}"]=1
            manifest_filenames["${filename}"]=1

            artifact_path="${release_path}/${filename}"
            require_regular_index_blob "${artifact_path}"
            [[ "$(git cat-file blob "${tree_sha}:${artifact_path}" | \
              sha256sum | awk '{print $1}')" == "${artifact_sha}" ]]
            if [[ "${origin}" == "built" ]]; then
              [[ -z "${reused_components[${component}]+present}" ]]
            else
              [[ "${reused_components[${component}]}" == \
                "${filename}:${artifact_sha}:${origin}" ]]
              printf '%s\t%s\t%s\t%s\n' \
                "${component}" "${filename}" "${artifact_sha}" "${origin}" \
                >>"${manifest_reused}"
            fi
            printf '%s\n' "${filename}" >>"${expected_release_files}"
            artifact_count=$((artifact_count + 1))
          done < <(
            jq -r '.artifacts[] | [.component, .filename, .origin, .sha256] | @tsv' \
              "${release_manifest}"
          )
          [[ "${artifact_count}" -eq \
            "$(jq '.artifacts | length' "${release_manifest}")" ]]
          [[ "${artifact_count}" -eq \
            "$(( ${#manifest_components[@]} ))" ]]

          awk -F '\t' -v prefix="${release_path}/" \
            '$1 == "A" && index($2, prefix) == 1 { print substr($2, length(prefix) + 1) }' \
            "${actual_changes}" | LC_ALL=C sort >"${actual_release_files}"
          LC_ALL=C sort "${expected_release_files}" \
            >"${expected_release_files}.sorted"
          cmp --silent "${actual_release_files}" "${expected_release_files}.sorted"

          metadata_reused="${RUNNER_TEMP}/platform-metadata-reused.tsv"
          jq -r '
            .reused_git_blobs[] |
            [.component, .filename, .sha256, .origin] | @tsv
          ' "${PUBLICATION_DIR}/metadata.json" | LC_ALL=C sort \
            >"${metadata_reused}"
          LC_ALL=C sort "${manifest_reused}" >"${manifest_reused}.sorted"
          cmp --silent "${metadata_reused}" "${manifest_reused}.sorted"

          message="release: platform v${EXPECTED_VERSION}"
          release_commit="$(
            printf '%s\n' "${message}" |
              env \
                GIT_AUTHOR_NAME="github-actions[bot]" \
                GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
                GIT_AUTHOR_DATE="${source_epoch} +0000" \
                GIT_COMMITTER_NAME="github-actions[bot]" \
                GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
                GIT_COMMITTER_DATE="${source_epoch} +0000" \
                git commit-tree "${tree_sha}" -p "${EXPECTED_SOURCE_SHA}"
          )"
          [[ "${release_commit}" == "${metadata_commit}" ]]
          [[ "$(git rev-list --parents -n 1 "${release_commit}")" == \
            "${release_commit} ${EXPECTED_SOURCE_SHA}" ]]

          echo "branch=${branch}" >>"${GITHUB_OUTPUT}"
          echo "release_commit=${release_commit}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Publication payload independently verified"
            echo
            echo "- Source CI run: ${metadata_ci_id}"
            echo "- Source CI attempt: ${metadata_ci_attempt}"
            echo "- Release commit: ${release_commit}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Atomically create the absent release and synchronization branches
        id: publish_refs
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PUBLICATION_DIR: ${{ runner.temp }}/platform-publication
          RELEASE_BRANCH: ${{ steps.verify.outputs.branch }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.release_commit }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          SYNC_BRANCH: sync/platform-v${{ needs.candidate.outputs.platform_version }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          [[ "${ACTOR}" == "${OWNER}" ]]
          [[ "${TRIGGERING_ACTOR}" == "${OWNER}" ]]
          [[ "${RUN_ATTEMPT}" == "1" ]]
          [[ "${RELEASE_BRANCH}" =~ ^release/platform-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${RELEASE_BRANCH}" == "release/platform-v${EXPECTED_VERSION}" ]]
          [[ "${SYNC_BRANCH}" =~ ^sync/platform-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${SYNC_BRANCH}" == "sync/platform-v${EXPECTED_VERSION}" ]]
          [[ "$(git rev-list --parents -n 1 "${RELEASE_COMMIT}")" == \
            "${RELEASE_COMMIT} ${EXPECTED_SOURCE_SHA}" ]]
          [[ -f "${PUBLICATION_DIR}/release-state.json" ]]
          [[ ! -L "${PUBLICATION_DIR}/release-state.json" ]]

          # Pin the predecessor refs again immediately before the only remote
          # write. The final absent-ref lease below closes the target race.
          python3 ops/release/ledger.py verify \
            --root . \
            --source-commit "${EXPECTED_SOURCE_SHA}" \
            --remote origin \
            --release-root releases/platform \
            --target-version "${EXPECTED_VERSION}" \
            --output "${RUNNER_TEMP}/final-release-state.json" >/dev/null
          cmp --silent \
            "${PUBLICATION_DIR}/release-state.json" \
            "${RUNNER_TEMP}/final-release-state.json"

          auth_header="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" |
              base64 |
              tr -d '\n'
          )"
          git_auth=(-c "http.extraheader=AUTHORIZATION: basic ${auth_header}")

          read_remote_refs() {
            local attempt output pattern status temporary
            pattern="$1"
            output="$2"
            temporary="${output}.attempt"
            for attempt in 1 2 3; do
              set +e
              timeout --signal=TERM 30s \
                git "${git_auth[@]}" ls-remote --refs origin "${pattern}" |
                LC_ALL=C sort >"${temporary}"
              status=$?
              set -e
              if [[ "${status}" -eq 0 ]] && mv -- "${temporary}" "${output}"; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep "${attempt}"
              fi
            done
            return 1
          }

          remote_main="$(
            git "${git_auth[@]}" ls-remote --refs origin refs/heads/main |
              awk '{print $1}'
          )"
          if [[ "${remote_main}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "main moved before publication; refusing to push." >&2
            exit 1
          fi

          release_snapshot_failure() {
            local reason="$1"
            echo "${reason}" >&2
            {
              echo "### Release-ref publication requires manual review"
              echo
              echo "${reason}"
              echo "The workflow stopped because it could not prove an exact"
              echo "append-only release namespace transition. Do not move or delete"
              echo "any immutable release ref. If both new refs exist at the exact"
              echo "release commit, open the synchronization PR manually:"
              echo
              echo "- ${SERVER_URL}/${REPOSITORY}/compare/main...${SYNC_BRANCH}?expand=1"
              echo "- Expected release commit: ${RELEASE_COMMIT}"
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          }

          for branch in "${RELEASE_BRANCH}" "${SYNC_BRANCH}"; do
            set +e
            git "${git_auth[@]}" ls-remote \
              --exit-code --heads origin "refs/heads/${branch}" >/dev/null
            branch_status=$?
            set -e
            if [[ "${branch_status}" -eq 0 ]]; then
              release_snapshot_failure \
                "Publication ref already exists; refusing to overwrite ${branch}."
            fi
            if [[ "${branch_status}" -ne 2 ]]; then
              release_snapshot_failure \
                "Could not establish that publication ref ${branch} is absent."
            fi
          done

          # Bind the final ledger report to the authenticated remote namespace
          # immediately before the atomic write. This rejects movement or
          # additions to any already-published immutable release ref.
          release_refs_before="${RUNNER_TEMP}/platform-release-refs-before.tsv"
          expected_refs_before="${RUNNER_TEMP}/platform-release-refs-expected.tsv"
          if ! read_remote_refs \
            'refs/heads/release/platform-v*' "${release_refs_before}"; then
            release_snapshot_failure \
              "Could not read the immutable release namespace before publication."
          fi
          jq -r '.releases[] | [.release_commit, .ref] | @tsv' \
            "${PUBLICATION_DIR}/release-state.json" | LC_ALL=C sort \
            >"${expected_refs_before}"
          if ! cmp --silent "${release_refs_before}" "${expected_refs_before}"; then
            release_snapshot_failure \
              "Immutable release refs changed after final ledger verification."
          fi

          post_push_unexpected_error() {
            trap - ERR TERM
            release_snapshot_failure \
              "An unexpected error interrupted post-push verification."
          }
          # From this point onward the remote write might have succeeded. Any
          # unexpected shell error or external termination must leave a manual
          # recovery path in the run summary.
          trap post_push_unexpected_error ERR TERM
          if push_output="$(
            timeout --signal=TERM --kill-after=10s 120s \
              git "${git_auth[@]}" push --atomic --porcelain \
              --force-with-lease="refs/heads/${RELEASE_BRANCH}:" \
              --force-with-lease="refs/heads/${SYNC_BRANCH}:" \
              origin \
              "${RELEASE_COMMIT}:refs/heads/${RELEASE_BRANCH}" \
              "${RELEASE_COMMIT}:refs/heads/${SYNC_BRANCH}" 2>&1
          )"; then
            push_status=0
          else
            # A timeout, transport failure, or lost response is ambiguous. Do
            # not retry the write; prove the exact two-ref outcome below.
            push_status=$?
          fi
          printf '%s\n' "${push_output}"

          # The very first authenticated read after the atomic push must be the
          # complete immutable namespace. It may differ only by the one exact
          # release ref this run was authorized to create.
          release_refs_after="${RUNNER_TEMP}/platform-release-refs-after.tsv"
          expected_refs_after="${RUNNER_TEMP}/platform-release-refs-after-expected.tsv"
          if ! read_remote_refs \
            'refs/heads/release/platform-v*' "${release_refs_after}"; then
            release_snapshot_failure \
              "Could not read immutable release refs after the atomic push."
          fi
          {
            cat "${release_refs_before}"
            printf '%s\t%s\n' \
              "${RELEASE_COMMIT}" "refs/heads/${RELEASE_BRANCH}"
          } | LC_ALL=C sort >"${expected_refs_after}"
          if ! cmp --silent "${release_refs_after}" "${expected_refs_after}"; then
            release_snapshot_failure \
              "Atomic push did not make the exact append-only release-ref transition."
          fi

          # The sync namespace is intentionally mutable and is not part of the
          # immutable ledger; verify its new ref separately and exactly.
          sync_ref_after="${RUNNER_TEMP}/platform-sync-ref-after.tsv"
          if ! read_remote_refs \
            "refs/heads/${SYNC_BRANCH}" "${sync_ref_after}"; then
            release_snapshot_failure \
              "Could not read the synchronization ref after the atomic push."
          fi
          published_sync="$(<"${sync_ref_after}")"
          expected_sync="${RELEASE_COMMIT}"$'\t'"refs/heads/${SYNC_BRANCH}"
          if [[ "${published_sync}" != "${expected_sync}" ]]; then
            release_snapshot_failure \
              "Atomic push did not create the exact synchronization ref."
          fi
          push_recovered=false
          if [[ "${push_status}" -ne 0 ]]; then
            # A lost response can follow a fully accepted atomic push. Exact
            # remote equality for both refs is the only recoverable outcome.
            push_recovered=true
          fi
          echo "release_branch=${RELEASE_BRANCH}" >>"${GITHUB_OUTPUT}"
          echo "release_commit=${RELEASE_COMMIT}" >>"${GITHUB_OUTPUT}"
          echo "sync_branch=${SYNC_BRANCH}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Platform release and synchronization branches published"
            echo
            echo "- Immutable branch: ${RELEASE_BRANCH}"
            echo "- Synchronization branch: ${SYNC_BRANCH}"
            echo "- Parent source: ${EXPECTED_SOURCE_SHA}"
            echo "- Release commit: ${RELEASE_COMMIT}"
            echo "- Ambiguous push recovered: ${push_recovered}"
            echo
            echo "Production was not deployed and main was not modified."
          } >>"${GITHUB_STEP_SUMMARY}"
          trap - ERR TERM

  synchronize_release:
    name: Open mandatory release synchronization PR
    if: ${{ inputs.publish_release_branch }}
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      platform_version: ${{ needs.candidate.outputs.platform_version }}
      release_commit: ${{ needs.publish.outputs.release_commit }}
      source_commit: ${{ inputs.expected_source_sha }}
      sync_pr_number: ${{ steps.sync_pr.outputs.number }}
      sync_pr_url: ${{ steps.sync_pr.outputs.url }}
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Open or recover the exact synchronization pull request
        id: sync_pr
        env:
          ACTOR: ${{ github.actor }}
          API_URL: ${{ github.api_url }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.platform_version }}
          GITHUB_TOKEN: ${{ secrets.BUH_RELEASE_PR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_BRANCH: ${{ needs.publish.outputs.release_branch }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.release_commit }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SYNC_BRANCH: ${{ needs.publish.outputs.sync_branch }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          [[ "${ACTOR}" == "${OWNER}" ]]
          [[ "${TRIGGERING_ACTOR}" == "${OWNER}" ]]
          test -n "${GITHUB_TOKEN}" || {
            echo "BUH_RELEASE_PR_TOKEN is required to create a trusted-owner sync PR." >&2
            exit 78
          }
          python3 ops/release/open_sync_pr.py \
            --owner "${OWNER}" \
            --repository "${REPOSITORY}" \
            --version "${EXPECTED_VERSION}" \
            --release-branch "${RELEASE_BRANCH}" \
            --sync-branch "${SYNC_BRANCH}" \
            --source-sha "${EXPECTED_SOURCE_SHA}" \
            --release-commit "${RELEASE_COMMIT}" \
            --api-url "${API_URL}" \
            --server-url "${SERVER_URL}" \
            --output "${RUNNER_TEMP}/release-sync-pr.json" >/dev/null
