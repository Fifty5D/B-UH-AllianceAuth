version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/platform/requirements"
    # Dependabot proposes reviewed direct-pin changes. Hash locks are intentionally
    # regenerated by ops/supply_chain.py and must be reviewed in the same PR.
    schedule: &weekly-python
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Etc/UTC
    groups: &python-groups
      python-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/apps/structure-ops"
    schedule: *weekly-python
    groups: *python-groups
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/apps/mining-analytics"
    schedule: *weekly-python
    groups: *python-groups
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/apps/moon-tax"
    schedule: *weekly-python
    groups: *python-groups
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/tests/browser"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Etc/UTC
    groups:
      browser-tests:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/platform/testenv"
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: Etc/UTC
    groups:
      test-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
