[tool.ruff]
target-version = "py312"
line-length = 92
extend-exclude = [
  "releases",
  "build",
  "dist",
  ".moon-extract",
  ".ops-extract",
  ".analytics-extract",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"apps/mining-analytics/src/buh_mining_analytics/analytics.py" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
