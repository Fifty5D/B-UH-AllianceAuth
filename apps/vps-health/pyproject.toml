[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-buh-vps-health"
dynamic = ["version"]
description = "Live VPS, Docker, and Celery worker monitoring and guarded controls for Alliance Auth"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Bureau of Unified Harvesting" }]
dependencies = [
  "allianceauth>=5.4,<5.5",
  "aa-buh-structure-ops>=0.3,<0.4",
]

[project.urls]
Repository = "https://github.com/Fifty5D/B-UH-AllianceAuth"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "buh_vps_health.__version__" }

[tool.setuptools.package-data]
buh_vps_health = [
  "static/buh_vps_health/css/*.css",
  "static/buh_vps_health/js/*.js",
  "templates/buh_vps_health/*.html",
]
