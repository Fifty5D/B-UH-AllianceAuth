[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-buh-memberaudit-autoreg"
dynamic = ["version"]
description = "Automatically register full-scope Alliance Auth characters in AA Member Audit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Bureau of Unified Harvesting" }]
dependencies = [
  "allianceauth>=5.4,<5.5",
  "aa-memberaudit>=5.0.4,<5.1",
  "django-esi>=9.6,<9.7",
]

[project.urls]
Repository = "https://github.com/Fifty5D/B-UH-AllianceAuth"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "buh_memberaudit_autoreg.__version__" }
