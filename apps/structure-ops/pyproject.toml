[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-buh-structure-ops"
dynamic = ["version"]
description = "Structure, fuel, extraction, timer, war, and alert operations for Alliance Auth"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Bureau of Unified Harvesting" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "allianceauth>=5.2,<5.3",
  "django-esi>=9.6,<9.7",
  "aa-structures==4.0.3",
  "aa-moonmining==3.1.0.post1",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/Fifty5D/B-UH-AllianceAuth"
Issues = "https://github.com/Fifty5D/B-UH-AllianceAuth/issues"
Changelog = "https://github.com/Fifty5D/B-UH-AllianceAuth/tree/main/releases"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "buh_structure_ops.__version__" }

[tool.setuptools.package-data]
buh_structure_ops = [
  "templates/buh_structure_ops/*.html",
  "static/buh_structure_ops/css/*.css",
  "static/buh_structure_ops/js/*.js",
]
