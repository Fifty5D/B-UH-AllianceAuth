[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-buh-moon-tax"
dynamic = ["version"]
description = "Extraction-period moon tax auditing, payment review, and access control for Alliance Auth"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Bureau of Unified Harvesting" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "allianceauth>=5.2,<5.3",
  "django-esi>=9.6,<9.7",
  "aa-memberaudit>=5,<6",
  "aa-moonmining==3.1.0.post1",
  "aa-buh-structure-ops>=0.2.1,<0.4",
  "requests>=2.31,<3",
]

[project.urls]
Repository = "https://github.com/Fifty5D/B-UH-AllianceAuth"
Issues = "https://github.com/Fifty5D/B-UH-AllianceAuth/issues"
Changelog = "https://github.com/Fifty5D/B-UH-AllianceAuth/tree/main/releases"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "buh_moon_tax.__version__" }

[tool.setuptools.package-data]
buh_moon_tax = [
  "templates/buh_moon_tax/*.html",
  "templates/buh_moon_tax/includes/*.html",
  "templates/buh_moon_tax/widgets/*.html",
  "static/buh_moon_tax/css/*.css",
  "static/buh_moon_tax/js/*.js",
]
