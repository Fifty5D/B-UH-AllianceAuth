[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-buh-mining-analytics"
dynamic = ["version"]
description = "Mining analytics dashboards for Alliance Auth and AA Member Audit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Bureau of Unified Harvesting" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "allianceauth>=5.2,<5.3",
  "aa-memberaudit>=5,<6",
  "packaging>=24,<26",
]

[project.urls]
Repository = "https://github.com/Fifty5D/B-UH-AllianceAuth"
Issues = "https://github.com/Fifty5D/B-UH-AllianceAuth/issues"
Changelog = "https://github.com/Fifty5D/B-UH-AllianceAuth/tree/main/releases"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "buh_mining_analytics.__version__" }

[tool.setuptools.package-data]
buh_mining_analytics = [
  "templates/buh_mining_analytics/*.html",
  "static/buh_mining_analytics/css/*.css",
  "static/buh_mining_analytics/js/*.js",
]
